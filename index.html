<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruchs Organisations App</title>
<meta name="description" content="Kalender, Einkauf, Schule und Ämtli für Ka, Pädu, Anna, Moritz und Paul.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ruchs App">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EAF1F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101720" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png" sizes="512x512" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EAF1F8;
  --surface:#FBFDFF;
  --surface-2:#E1EAF4;
  --ink:#1C2A38;
  --muted:#63768A;
  --line:#CFDDEB;
  --line-soft:#DFE9F3;
  --alert:#B23B31;
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 -1px 0 var(--line), 0 -8px 24px rgba(28,42,56,.08);
  --pad:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101720;
    --surface:#18212C;
    --surface-2:#1F2A37;
    --ink:#E6EEF7;
    --muted:#8FA2B5;
    --line:#2B3846;
    --line-soft:#222E3B;
    --alert:#E2776B;
    --shadow:0 -1px 0 var(--line), 0 -8px 24px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --paper:#101720; --surface:#18212C; --surface-2:#1F2A37;
  --ink:#E6EEF7; --muted:#8FA2B5; --line:#2B3846; --line-soft:#222E3B;
  --alert:#E2776B; --shadow:0 -1px 0 var(--line), 0 -8px 24px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;height:100%;
  background:var(--paper);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.num{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;font-weight:600;letter-spacing:-.015em;margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- Shell ---------- */
.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:var(--paper);border-bottom:1px solid var(--line-soft);
  padding:12px var(--pad) 10px;
  display:flex;align-items:baseline;gap:10px;justify-content:space-between;
}
.topbar .date{font-size:12.5px;color:var(--muted)}
.topbar h1{font-size:20px}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
main{flex:1;padding:var(--pad) var(--pad) 96px}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--surface);box-shadow:var(--shadow);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  display:flex;
}
.tabbar-inner{max-width:760px;margin:0 auto;display:flex;width:100%}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:10.5px;font-weight:500}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .tabdot{opacity:1}
.tabdot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:0;margin-top:-1px}
.tab svg{width:21px;height:21px}

/* ---------- Bausteine ---------- */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px}
.card + .card{margin-top:12px}
.sec{margin-top:26px}
.sec:first-child{margin-top:4px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-head h2{font-size:16px}
.sec-head .hint{font-size:12.5px;color:var(--muted)}
.linkbtn{font-size:13px;font-weight:500;color:var(--muted);padding:4px 8px;border-radius:8px}
.linkbtn:hover{background:var(--surface-2);color:var(--ink)}
.btn{background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:999px;font-size:14px;font-weight:500}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:active{transform:translateY(1px)}
.empty{color:var(--muted);font-size:13.5px;padding:14px;border:1px dashed var(--line);border-radius:var(--radius);text-align:center}

.avatar{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;
  color:#fff;font-weight:600;font-size:12.5px;letter-spacing:-.01em;font-family:"Bricolage Grotesque",sans-serif;
}
.avatar.sm{width:24px;height:24px;font-size:9.5px}
.avatar.ph{background-size:cover;background-position:center;color:transparent}
.photorow{display:flex;align-items:center;gap:12px}
.avatar.xl{width:64px;height:64px;font-size:22px}
.avatar.lg{width:44px;height:44px;font-size:15.5px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin:0 calc(var(--pad)*-1);padding-left:var(--pad);padding-right:var(--pad);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none;
  border:1px solid var(--line);background:var(--surface);
  padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);
}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}

/* Heute-Streifen */
.today-strip{display:flex;gap:8px;overflow-x:auto;margin:0 calc(var(--pad)*-1);padding:2px var(--pad) 6px;scrollbar-width:none}
.today-strip::-webkit-scrollbar{display:none}
.person-col{
  flex:none;width:138px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--radius);padding:12px;border-top:3px solid var(--pc);
}
.person-col .nm{font-size:13px;font-weight:600;margin-top:8px}
.person-col .nx{font-size:12.5px;color:var(--muted);margin-top:4px;min-height:34px}
.person-col .tm{font-family:"Bricolage Grotesque",sans-serif;font-size:15px;font-weight:600;margin-top:6px}

/* Zeilen */
.row{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:none}
.row .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--pc);flex:none;min-height:34px}
.row .body{flex:1;min-width:0}
.row .t{font-size:14.5px;font-weight:500;line-height:1.3}
.row .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.row .r{font-family:"Bricolage Grotesque",sans-serif;font-size:14px;font-weight:600;white-space:nowrap;padding-top:1px}
.row.done .t{text-decoration:line-through;color:var(--muted)}

.check{
  width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex:none;
  display:grid;place-items:center;margin-top:1px;background:var(--surface);
}
.check[aria-pressed="true"]{background:var(--pc,var(--ink));border-color:var(--pc,var(--ink))}
.check svg{width:13px;height:13px;color:#fff;opacity:0}
.check[aria-pressed="true"] svg{opacity:1}


/* Planer: Tage als Zeilen, Personen als Spalten */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{padding:5px 13px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.p-wrap{margin:12px calc(var(--pad)*-1) 0;background:var(--surface);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.p-scroll{overflow:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;
  overscroll-behavior:contain;
  max-height:calc(100vh - 250px);
  max-height:calc(100dvh - 250px);
  min-height:300px}
.pgrid{display:grid;min-width:100%;--daycol:42px}
.p-corner,.p-hcell{position:sticky;top:0;z-index:5;background:var(--surface);box-shadow:0 1px 0 var(--line);
  border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:4px;
  min-width:0;overflow:hidden;
  font-size:11.5px;font-weight:600;font-family:"Bricolage Grotesque",sans-serif}
.p-hcell{letter-spacing:.02em;color:var(--muted)}
.p-head{flex-direction:column;justify-content:stretch;gap:0;padding:0;align-items:stretch}
.p-head .hb{display:flex;height:14px}
.p-head .hb span{flex:1;text-align:center;font-size:9px;line-height:14px;
  border-left:1px solid var(--line);color:var(--muted)}
.p-head .hb span:first-child{border-left:none}
.p-head .hs{display:flex;height:20px;border-top:1px solid var(--line-soft)}
.p-head .hs span{flex:1;text-align:center;font-size:8.5px;line-height:19px;
  border-left:1px solid var(--line-soft);color:var(--muted);font-variant-numeric:tabular-nums}
.p-head .hs span.bandstart{border-left-color:var(--line)}
.p-head .hs span:first-child{border-left:none}
.p-corner{left:0;z-index:6;font-size:9px;color:var(--muted)}
.p-hcell{border-left:1px solid var(--line-soft)}
.p-rowline{grid-column:1/-1;z-index:0;border-bottom:1px solid var(--line-soft)}
.p-rowline.we{background:var(--surface-2)}
.p-day{position:sticky;left:0;z-index:4;background:var(--surface);
  display:flex;align-items:flex-start;gap:3px;padding:6px 3px 0;font-size:11px;
  border-bottom:1px solid var(--line-soft);
  border-right:1px solid var(--line);text-align:left;width:100%}
.p-day.we{background:var(--surface-2)}
.p-day b{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:12.5px;min-width:15px;text-align:right}
.p-day span{color:var(--muted);font-size:9px;padding-top:1px}
.p-day u{margin-left:auto;color:var(--muted);font-size:8px;text-decoration:none;font-variant-numeric:tabular-nums;padding-top:1px}
@media (max-width:420px){ .p-day u{display:none} }
.p-day.red b{color:var(--alert)}
.p-day[aria-pressed="true"]{background:var(--ink)}
.p-day[aria-pressed="true"] b,.p-day[aria-pressed="true"] span,.p-day[aria-pressed="true"] u{color:var(--paper)}
.p-colbg{z-index:0;border-left:1px solid var(--line-soft)}
.p-layer{position:relative;z-index:2}
.p-ev{position:absolute;border-radius:5px;padding:2px 5px;font-size:10.5px;line-height:1.2;
  overflow:hidden;border-left:2px solid var(--pc);color:var(--ink);
  /* Passt der Text nicht neben die Uhrzeit, bricht er auf die zweite Zeile */
  white-space:normal;overflow-wrap:anywhere;word-break:break-word;hyphens:auto;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.p-ev b{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;margin-right:3px;font-size:10px}
.p-ev .rz{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;z-index:3;
  display:flex;align-items:center;justify-content:center}
.p-ev .rz::after{content:'';width:2px;height:55%;border-radius:1px;background:var(--pc);opacity:.55}
.p-ev .rz-l{left:0}
.p-ev .rz-r{right:0}
.p-ev.dehnbar{padding-right:10px}
.p-ev.dehnt{box-shadow:0 0 0 2px var(--pc);z-index:5}
.p-ev .pk{display:inline-block;color:#fff;font-size:8.5px;font-weight:600;font-style:normal;
  font-family:"Bricolage Grotesque",sans-serif;border-radius:3px;padding:0 3px;margin-right:4px;
  vertical-align:1px;letter-spacing:.02em}
.p-legend{font-size:11.5px;color:var(--muted);margin-top:8px;text-align:center}

.p-ev{cursor:grab;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.p-layer{-webkit-touch-callout:none}
.p-ev.ghosted{opacity:.25}
.drag-ghost{position:fixed;z-index:200;pointer-events:none;opacity:.95;
  box-shadow:0 10px 26px rgba(20,35,50,.32);transform:scale(1.03);cursor:grabbing}
.p-drop{position:absolute;border:2px dashed var(--ink);border-radius:5px;
  pointer-events:none;opacity:.6;display:flex;align-items:center;justify-content:center;
  font-family:"Bricolage Grotesque",sans-serif;font-size:9.5px;font-weight:600;
  color:var(--ink);background:var(--surface-2);overflow:hidden}
.p-layer{touch-action:pan-x pan-y}
body.dragging{user-select:none;-webkit-user-select:none}
body.dragging .p-scroll{touch-action:none}
.lock{position:fixed;inset:0;z-index:400;background:#2B2F33;display:none;
  align-items:center;justify-content:center;padding:24px;
  padding-top:calc(24px + env(safe-area-inset-top,0px))}
.lock.on{display:flex}
.lockbox{width:100%;max-width:380px;text-align:center}
/* Anmeldebildschirm mit Bild im Hintergrund */
.lock .lockbox{position:relative;z-index:1;color:#fff}
.lock .lockhint{color:rgba(255,255,255,.82)}
.lock .lockerr{color:#FFC7BC}
.lock .lockperson{background:rgba(255,255,255,.13);color:#fff;
  border-color:rgba(255,255,255,.24);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lock .field label{color:rgba(255,255,255,.82)}
.lock .field input{background:rgba(255,255,255,.14);color:#fff;
  border-color:rgba(255,255,255,.3);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lock .field input::placeholder{color:rgba(255,255,255,.5)}
.lock .btn{background:#fff;color:#16222E;text-shadow:none}
.lock .btn.ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.32)}
.lock .linkbtn{color:rgba(255,255,255,.85)}
.lock .avatar{box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.lockbox h2{font-size:21px;margin-top:10px}
.lockhint{color:var(--muted);font-size:13.5px;margin:6px 0 20px}
.lockgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px}
.lockperson .avatar{margin-bottom:2px}
.lockperson{display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:14px 6px;border:1px solid var(--line-soft);border-radius:var(--radius);
  background:var(--surface);font-size:13px;font-weight:500}
.lockperson:active{transform:scale(.97)}
.lockbox .avatar.xl{margin:0 auto}
.pin{width:100%;text-align:center;font-size:24px;letter-spacing:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:12px;font-family:"Bricolage Grotesque",sans-serif}
.lockerr{color:var(--alert);font-size:13px;margin:10px 0 0}
.lockbox .field{text-align:left}
.netdot{width:9px;height:9px;border-radius:50%;flex:none;align-self:center}
.netdot.on{background:#1F8A5B}
.netdot.off{background:#C9A227}
.lockact{display:flex;gap:10px;margin-top:16px}
.lockact .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,14px);background:var(--ink);color:var(--paper);
  padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:300;opacity:0;
  transition:opacity .18s ease,transform .18s ease;pointer-events:none;max-width:84%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.micbox{display:flex;align-items:center;gap:12px;background:var(--surface-2);
  border:1px solid var(--line-soft);border-radius:var(--radius);padding:11px 12px;margin-bottom:14px}
.micbtn{width:42px;height:42px;flex:none;border-radius:50%;background:var(--ink);color:var(--paper);
  display:grid;place-items:center}
.micbtn.hoert{background:var(--alert);animation:pulsiert 1.1s ease-in-out infinite}
@keyframes pulsiert{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.micline{font-size:13px;font-weight:500}
.micsub{font-size:12px;color:var(--muted);margin-top:2px}
.permrow{padding:11px 0;border-bottom:1px solid var(--line-soft)}
.permrow:last-child{border-bottom:none}
.permrow .t{font-size:14px;margin-bottom:7px}
.permrow .seg{width:100%}
.permrow .seg button{flex:1;padding:5px 4px;font-size:12px}
.seg button:disabled{opacity:.45}

/* Einkauf */
.addbar{display:flex;gap:8px;align-items:center;padding:10px 0 2px}
.addbar input{
  flex:1;background:var(--surface-2);border:1px solid var(--line-soft);
  border-radius:10px;padding:10px 12px;font-size:14.5px;min-width:0;
}
.addbar input::placeholder{color:var(--muted)}
.qty{font-size:12.5px;color:var(--muted)}

/* Sackgeld */
.money{display:flex;align-items:flex-end;gap:8px;margin-top:2px}
.money .big{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;font-weight:700;line-height:1}
.money .was{font-size:13px;color:var(--muted);text-decoration:line-through;padding-bottom:3px}
.ledger{margin-top:10px;border-top:1px solid var(--line-soft);padding-top:8px}
.ledger .li{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;color:var(--muted)}
.ledger .li b{font-weight:500;color:var(--alert);font-family:"Bricolage Grotesque",sans-serif}
.tallybtns{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.tallybtn{border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--muted)}
.tallybtn:hover{border-color:var(--ink);color:var(--ink)}
.strikes{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:1px;font-size:15px;color:var(--alert)}

/* Chat */
.chatwrap{display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;display:flex;gap:9px;align-items:flex-end}
.msg .bub{background:var(--surface);border:1px solid var(--line-soft);padding:9px 12px;border-radius:14px 14px 14px 4px;font-size:14.5px}
.msg .who{font-size:11.5px;color:var(--muted);margin-bottom:2px;font-weight:500}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:var(--ink);color:var(--paper);border-color:var(--ink);border-radius:14px 14px 4px 14px}
.chatbar{display:flex;gap:8px;margin-top:16px;position:sticky;bottom:0;background:var(--paper);padding:8px 0}
.chatbar input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 15px;min-width:0}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(16,28,40,.45);z-index:50;display:none}
.scrim.open{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);
  border-radius:18px 18px 0 0;padding:18px var(--pad) calc(22px + env(safe-area-inset-bottom,0px));
  max-width:760px;margin:0 auto;transform:translateY(100%);transition:transform .22s ease;
  max-height:88vh;overflow-y:auto;
}
.sheet.open{transform:translateY(0)}
.sheet h3{font-size:17px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px}
.field .two{display:flex;gap:10px}
.sheet .actions{display:flex;gap:10px;margin-top:18px}
.sheet .actions .btn{flex:1;text-align:center}

.footnote{margin-top:28px;text-align:center;font-size:12px;color:var(--muted)}
.footnote button{text-decoration:underline;color:var(--muted);font-size:12px}

@media (min-width:720px){
  main{padding:22px 22px 110px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  .cols .sec{margin-top:0}
  .cols .sec + .sec{margin-top:26px}
}
</style>
</head>
<body>

  return { start: iso(addDays(end, -(len-1))), end: iso(end) };
}

/* Kalenderwoche nach ISO */
function isoWeek(d){
  const t = new Date(d); t.setHours(0,0,0,0);
  t.setDate(t.getDate() + 3 - ((t.getDay()+6)%7));
  const w1 = new Date(t.getFullYear(), 0, 4);
  return 1 + Math.round(((t - w1)/86400000 - 3 + ((w1.getDay()+6)%7)) / 7);
}
/* Ostersonntag, daraus die beweglichen Feiertage */
function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
        f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
        i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
        mm=Math.floor((h+l-7*m+114)/31),dd=((h+l-7*m+114)%31)+1;
  return new Date(y, mm-1, dd);
}
const holCache = {};
function holidays(y){
  if (holCache[y]) return holCache[y];
  const E = easter(y), o = n => iso(addDays(E, n)), P = m => `${y}-${m}`;
  const h = {};
  h[P('01-01')]='Neujahr'; h[P('01-02')]='Berchtoldstag';
  h[o(-2)]='Karfreitag'; h[o(0)]='Ostern'; h[o(1)]='Ostermontag';
  h[P('05-01')]='Tag der Arbeit'; h[o(39)]='Auffahrt'; h[o(50)]='Pfingstmontag';
  h[P('08-01')]='Nationalfeiertag'; h[P('12-25')]='Weihnachten'; h[P('12-26')]='Stephanstag';
  return holCache[y] = h;
}
/* Hexfarbe leicht eingefärbt als Hintergrund */

  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}

/* Foto auf 200 Pixel quadratisch bringen, damit es in den Speicher passt */
function scaleImage(file, size){
  size = size || 200;
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(new Error('Datei nicht lesbar'));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('Kein gültiges Bild'));
      img.onload = () => {
        const c = document.createElement('canvas'); c.width = c.height = size;
        const x = c.getContext('2d');
        const k = Math.min(img.width, img.height);
        x.drawImage(img, (img.width-k)/2, (img.height-k)/2, k, k, 0, 0, size, size);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

const ZAHL = { null:0, eins:1, ein:1, eine:1, zwei:2, drei:3, vier:4, fünf:5, fuenf:5,
  sechs:6, sieben:7, acht:8, neun:9, zehn:10, elf:11, zwölf:12, zwoelf:12,
  dreizehn:13, vierzehn:14, fünfzehn:15, fuenfzehn:15, sechzehn:16, siebzehn:17,
  achtzehn:18, neunzehn:19, zwanzig:20, einundzwanzig:21, zweiundzwanzig:22, dreiundzwanzig:23 };

const entu = s => s.toLowerCase()
  .replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss');

function parseSpeech(text, members){
  let t = ' ' + text.toLowerCase().replace(/\s+/g,' ').trim() + ' ';

  /* 1. "halb sieben" -> 6:30, "viertel vor acht" -> 7:45, "viertel nach acht" -> 8:15 */
  const zahlMuster = Object.keys(ZAHL).join('|');
  t = t.replace(new RegExp(`\\bviertel vor (${zahlMuster}|\\d{1,2})\\b`,'g'),
    (_,z) => { const n = ZAHL[z] ?? +z; return ` ${((n+23)%24)}:45 `; });
  t = t.replace(new RegExp(`\\bviertel nach (${zahlMuster}|\\d{1,2})\\b`,'g'),
    (_,z) => { const n = ZAHL[z] ?? +z; return ` ${n}:15 `; });
  t = t.replace(new RegExp(`\\bhalb (${zahlMuster}|\\d{1,2})\\b`,'g'),
    (_,z) => { const n = ZAHL[z] ?? +z; return ` ${((n+23)%24)}:30 `; });

  /* 2. Zahlwörter zu Ziffern, aber nur wo eine Zeit gemeint sein kann */
  t = t.replace(new RegExp(`\\b(${zahlMuster})\\b(?=\\s*(uhr|bis|\\s|$))`,'g'), (m,w) => ` ${ZAHL[w]} `);

  /* 3. Zeitangaben einsammeln */
  const zeiten = [];
  const merk = (h, m, i, len) => {
    h = +h; m = m ? +m : 0;
    if (h > 23 || m > 59) return;
    zeiten.push({ v: String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'), i, len });
  };
  let mm;
  const re1 = /\b(\d{1,2})[:.](\d{2})\b/g;                       // 17:30 oder 17.30
  while ((mm = re1.exec(t))) merk(mm[1], mm[2], mm.index, mm[0].length);
  const re2 = /\b(\d{1,2})\s*uhr(?:\s*(\d{1,2}))?/g;             // 17 Uhr 30
  while ((mm = re2.exec(t))) merk(mm[1], mm[2], mm.index, mm[0].length);
  const re3 = /\b(?:von|ab|um|bis)\s+(\d{1,2})\b(?!\s*[:.]\d|\s*uhr)/g;  // "von 17 bis 19"
  while ((mm = re3.exec(t))) {
    const zi = mm.index + mm[0].indexOf(mm[1]);
    if (!zeiten.some(z => zi >= z.i && zi < z.i + z.len)) merk(mm[1], 0, zi, mm[1].length);
  }
  zeiten.sort((a,b) => a.i - b.i);

  /* 3b. Stunden 1 bis 6 meinen im Familienalltag den Nachmittag,
         ausser jemand sagt ausdrücklich morgens oder früh. */
  const frueh = /\b(morgens|früh|frueh|vormittag|vormittags|nachts|in der nacht)\b/.test(t);
  if (!frueh) zeiten.forEach(z => {
    const h = +z.v.slice(0,2);
    if (h >= 1 && h <= 6) z.v = String(h+12).padStart(2,'0') + z.v.slice(2);
  });
  /* Endet es vor dem Beginn, ist der Nachmittag gemeint */
  if (zeiten.length > 1 && zeiten[1].v < zeiten[0].v){
    const h = +zeiten[1].v.slice(0,2);
    if (h + 12 <= 23) zeiten[1].v = String(h+12).padStart(2,'0') + zeiten[1].v.slice(2);
  }

  /* 4. Person suchen */
  let person = null, pTreffer = null;
  const tn = entu(t);
  for (const m of members){
    const kandidaten = [entu(m.name)];
    if (m.role === 'shared') kandidaten.push('alle','familie','gemeinsam');
    for (const k of kandidaten){
      const r = new RegExp(`\\b${k}\\b`);
      const tr = r.exec(tn);
      if (tr){ person = m.id; pTreffer = { i: tr.index, len: k.length }; break; }
    }
    if (person) break;
  }

  /* 5. Alles Erkannte herausschneiden, Rest ist die Tätigkeit */
  const schnitte = zeiten.map(z => ({ i:z.i, len:z.len }));
  if (pTreffer) schnitte.push(pTreffer);
  schnitte.sort((a,b) => b.i - a.i);
  let rest = t;
  schnitte.forEach(s => { rest = rest.slice(0, s.i) + ' ' + rest.slice(s.i + s.len); });

  rest = rest
    .replace(/\b(von|bis|ab|um|uhr|für|fuer|mit|und|der|die|das|dann|noch|hat|haben|ist|morgens|früh|frueh|vormittag|vormittags|nachmittags|abends|nachts)\b/g,' ')
    .replace(/[,.;]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
  const titel = rest ? rest.charAt(0).toUpperCase() + rest.slice(1) : '';

  return { time: zeiten[0] ? zeiten[0].v : '', timeEnd: zeiten[1] ? zeiten[1].v : '', member: person, title: titel };
}


const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let hoert = null;
function speechAn(){
  if (!SR){
    toast('Dieses Gerät kennt keine Spracherkennung. Nutze das Mikrofon auf der Tastatur.');
    return;
  }
  if (hoert){ hoert.stop(); return; }
  const r = new SR();
  r.lang = 'de-CH'; r.interimResults = true; r.maxAlternatives = 1; r.continuous = false;
  const knopf = document.getElementById('micBtn');
  const anzeige = document.getElementById('micText');
  if (knopf) knopf.classList.add('hoert');
  if (anzeige) anzeige.textContent = 'Hört zu …';

  r.onresult = e => {
    let txt = '';
    for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
    if (anzeige) anzeige.textContent = txt;
    if (e.results[e.results.length-1].isFinal) uebernehmen(txt);
  };
  r.onerror = e => {
    if (anzeige) anzeige.textContent = e.error === 'not-allowed'
      ? 'Zugriff aufs Mikrofon verweigert.' : 'Nichts verstanden.';
  };
  r.onend = () => { hoert = null; if (knopf) knopf.classList.remove('hoert'); };
  try { r.start(); hoert = r; } catch(err){ toast('Mikrofon nicht verfügbar.'); }
}
function uebernehmen(txt){
  const g = parseSpeech(txt, MEMBERS);
  const setz = (id, wert) => { const el = document.getElementById(id); if (el && wert) el.value = wert; };
  setz('f-time', g.time); setz('f-timeend', g.timeEnd); setz('f-title', g.title);
  if (g.member){ const el = document.getElementById('f-mem'); if (el) el.value = g.member; }
  const anzeige = document.getElementById('micText');
  if (anzeige){
    const teile = [];
    if (g.time) teile.push(g.time + (g.timeEnd ? '–' + g.timeEnd : ''));
    if (g.member) teile.push(mem(g.member).name);
    if (g.title) teile.push(g.title);
    anzeige.textContent = teile.length ? 'Verstanden: ' + teile.join(' · ') : 'Nichts erkannt.';
  }
}

async function sbAuth(path, body){

async function login(email, pass){

  saveAuth({ access_token:j.access_token, refresh_token:j.refresh_token,
             expires_at: Date.now() + (j.expires_in || 3600)*1000,
             email: (j.user && j.user.email) || email });
  return auth;
}

async function refreshToken(){
  if (!auth || !auth.refresh_token) return false;
  try {
    const j = await sbAuth('token?grant_type=refresh_token', { refresh_token: auth.refresh_token });
    saveAuth({ access_token:j.access_token, refresh_token:j.refresh_token,
               expires_at: Date.now() + (j.expires_in || 3600)*1000, email: auth.email });
    return true;
  } catch(e){ saveAuth(null); return false; }
}

async function sbRest(path, opts){
  opts = opts || {};
  if (!auth) throw new Error('nicht angemeldet');
  if (auth.expires_at - Date.now() < 60000) await refreshToken();
  if (!auth) throw new Error('nicht angemeldet');
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, {
    method: opts.method || 'GET',
    headers: Object.assign({
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + auth.access_token,
      'Content-Type': 'application/json'
    }, opts.headers || {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (r.status === 401){ if (await refreshToken()) return sbRest(path, opts); throw new Error('Sitzung abgelaufen'); }
  if (!r.ok) throw new Error('Datenbank: ' + r.status + ' ' + (await r.text()).slice(0,140));
  return r.status === 204 ? null : r.json();
}

async function pull(){
  const namen = Object.keys(TABLES);
  const daten = await Promise.all(namen.map(n => sbRest(n + '?select=*')));
  namen.forEach((n, i) => TABLES[n].load(daten[i] || []));
  refreshMembers();
  snapshot();            // Stand als abgeglichen merken
  online = true;
  saveLocal();
}

/* ---- Hochladen, nur was sich geändert hat ---- */
let synced = {};
const keyOf = (t, r) => String(r[TABLES[t].pk || 'id']);
function snapshot(){
  synced = {};
  Object.keys(TABLES).forEach(t => {
    synced[t] = Object.fromEntries(TABLES[t].rows().map(r => [keyOf(t,r), JSON.stringify(r)]));
  });
}
async function push(){
  if (!auth) return;
  for (const t of Object.keys(TABLES)){
    const jetzt = TABLES[t].rows();
    const alt = synced[t] || {};
    const neu = jetzt.filter(r => alt[keyOf(t,r)] !== JSON.stringify(r));
    const ids = new Set(jetzt.map(r => keyOf(t,r)));
    const weg = Object.keys(alt).filter(k => !ids.has(k));
    const pk = TABLES[t].pk || 'id';
    if (neu.length)
      await sbRest(t, { method:'POST', body:neu, headers:{ 'Prefer':'resolution=merge-duplicates' } });
    for (const k of weg)
      await sbRest(`${t}?${pk}=eq.${encodeURIComponent(k)}`, { method:'DELETE' });
    synced[t] = Object.fromEntries(jetzt.map(r => [keyOf(t,r), JSON.stringify(r)]));
  }
  online = true;
}
function scheduleSync(){
  if (!auth) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => {
    push().then(markOnline).catch(err => { online = false; markOnline(); console.warn(err); });
  }, 600);
}
function markOnline(){
  const el = document.getElementById('netdot');
  if (el){ el.className = 'netdot ' + (online ? 'on' : 'off');
           el.title = online ? 'Mit der Datenbank verbunden' : 'Keine Verbindung, Änderungen warten'; }
}

/* ---- Regelmässig nachschauen, ob jemand anders etwas geändert hat ---- */

  pollTimer = setInterval(() => {
    if (document.hidden || dragState || document.querySelector('.sheet.open')) return;
    pull().then(() => { markOnline(); render(); })
          .catch(() => { online = false; markOnline(); });
  }, 20000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && auth)
      pull().then(() => { markOnline(); render(); }).catch(() => { online = false; markOnline(); });
  });
}

async function uploadLocal(quelle){
  const q = quelle || (() => { try { return JSON.parse(localStorage.getItem(BKEY) || 'null'); } catch(e){ return null; } })();
  if (!q || !(q.events || []).length){ toast('Auf diesem Gerät liegt kein Stand zum Hochladen.'); return false; }
  Object.assign(S, {
    events: q.events || [], menu: q.menu || [], school: q.school || [],
    chores: q.chores || [], strikes: q.strikes || [], chat: q.chat || [],
    imported: q.imported || []
  });
  if (q.lists && q.lists.length) S.lists = q.lists;
  if (q.members && q.members.length) S.members = q.members;
  if (q.allowance) S.allowance = q.allowance;
  if (q.perms) S.perms = q.perms;
  refreshMembers();
  synced = {};        // alles als noch nicht übertragen behandeln
  try { await push(); saveLocal(); toast(`${S.events.length} Termine hochgeladen.`); return true; }
  catch (err){ toast('Hochladen fehlgeschlagen: ' + err.message); return false; }
}

    if (neuSc && halt){ neuSc.scrollLeft = halt.l; neuSc.scrollTop = halt.t; }
  }
  if (tab === 'chat') window.scrollTo(0, document.body.scrollHeight);
  else if (gleicherTab && seite) window.scrollTo(0, seite);

  letzterTab = tab;
  save();
}

/* ============ Kalender ============ */
const RH = 30;                 // Höhe einer Terminzeile in Pixel
let planerGeo = null;

/* Die drei Tagesbereiche. Jeder ist innerlich in Stunden unterteilt,
   sichtbar bleiben aber nur die drei Spalten. */
const BANDS = [
  { l:'Morgen', std:'08:00', std_h:[5,6,7,8,9,10] },
  { l:'Mittag', std:'12:00', std_h:[11,12,13,14,15,16] },
  { l:'Abend',  std:'18:00', std_h:[17,18,19,20,21,22] }
];
const hh = h => String(h).padStart(2,'0') + ':00';
const SLOT0 = 5, SLOTN = 18;                       // 5 bis 22 Uhr, 18 Stunden
const slotOf = h => Math.min(SLOTN-1, Math.max(0, h - SLOT0));
const minOf = z => +z.slice(0,2)*60 + +z.slice(3,5);
/* Erster und letzter Stundenschritt eines Termins */
function slotSpan(e){
  if (!e.time) return [0, SLOTN-1];                       // ohne Uhrzeit: ganztags
  if (e.end && e.end > e.date) return [0, SLOTN-1];       // mehrtägig: ganztags
  const i1 = slotOf(+e.time.slice(0,2));
  if (!e.timeEnd || minOf(e.timeEnd) <= minOf(e.time)) return [i1, i1];
  const letzte = Math.ceil(minOf(e.timeEnd) / 60) - 1;
  return [i1, Math.max(i1, slotOf(letzte))];
}
/* Ohne Uhrzeit: über alle drei Bereiche */
const bandOf = t => !t ? -1 : (t < '11:00' ? 0 : t < '17:00' ? 1 : 2);

function planerHTML(){
  const y = S.ui.calYear, mo = S.ui.calMonth, filt = S.ui.calFilter;
  const nDays = new Date(y, mo+1, 0).getDate();
  const hol = holidays(y);
  const pad = n => String(n).padStart(2,'0');
  const first = `${y}-${pad(mo+1)}-01`, last = `${y}-${pad(mo+1)}-${pad(nDays)}`;

  /* 1. Termine des Monats, jeder mit Tagesbereich und Tagesspanne */
  const evs = S.events
    .filter(e => e.date <= last && evEnd(e) >= first)
    .filter(e => filt === 'alle' || e.member === filt)
    .map(e => {
      const [s1, s2] = slotSpan(e);
      return { ...e,
        a: e.date < first ? 1 : new Date(e.date+'T00:00').getDate(),
        b: evEnd(e) > last ? nDays : new Date(evEnd(e)+'T00:00').getDate(),
        c1: s1, c2: s2 };
    })
    .sort((x, z) => x.a - z.a
      || x.c1 - z.c1
      || (x.time||'').localeCompare(z.time||'')
      || (z.b - z.a) - (x.b - x.a)
      || x.title.localeCompare(z.title));

  /* 2. Zeilen vergeben: erst wenn sich Tage UND Bereiche überschneiden,
        muss ein Termin eine Zeile tiefer */
  const spuren = [];
  evs.forEach(e => {
    let l = 0;
    while (spuren[l] && spuren[l].some(o =>
      !(o.b < e.a || o.a > e.b) && !(o.c2 < e.c1 || o.c1 > e.c2))) l++;
    (spuren[l] = spuren[l] || []).push(e);
    e.zeile = l;
  });

  /* 3. Zeilenhöhen und Abstände */
  const zeilen = new Array(nDays + 2).fill(1);
  evs.forEach(e => { for (let d = e.a; d <= e.b; d++) zeilen[d] = Math.max(zeilen[d], e.zeile + 1); });
  const hoehe = d => zeilen[d] * RH;
  const off = new Array(nDays + 2).fill(0);
  for (let d = 1; d <= nDays + 1; d++) off[d] = off[d-1] + (d > 1 ? hoehe(d-1) : 0);
  planerGeo = { off, nDays };

  /* 4. Aufbauen */
  let html = `<div class="p-corner" style="grid-area:1/1">KW</div>`;
  html += `<div class="p-hcell p-head" style="grid-row:1;grid-column:2/-1">
    <div class="hb">${BANDS.map(bd => `<span>${bd.l}</span>`).join('')}</div>
    <div class="hs">${Array.from({length:SLOTN}, (_,i) =>
      `<span class="${i % 6 === 0 ? 'bandstart' : ''}">${SLOT0 + i}</span>`).join('')}</div>
  </div>`;

  for (let d = 1; d <= nDays; d++){
    const dt = new Date(y, mo, d), k = iso(dt), wd = dt.getDay();
    const we = (wd === 0 || wd === 6 || hol[k]);
    html += `<div class="p-rowline ${we?'we':''}" style="grid-row:${d+1}"></div>`;
  }

  for (let d = 1; d <= nDays; d++){
    const dt = new Date(y, mo, d), k = iso(dt), wd = dt.getDay();
    html += `<button class="p-day ${(wd===0||wd===6)?'we':''} ${(wd===0||hol[k])?'red':''}"
      style="grid-row:${d+1};grid-column:1" data-day="${k}"
      ${k===S.ui.calSel?'aria-pressed="true"':''} ${hol[k]?`title="${hol[k]}"`:''}>
      <b>${d}</b><span>${WD[wd]}</span><u>${wd===1?isoWeek(dt):''}</u></button>`;
  }

  /* Hintergrundspalten für die Trennlinien */
  BANDS.forEach((bd, i) => {
    html += `<div class="p-colbg" data-band="${i}" style="grid-row:2/-1;grid-column:${i+2}"></div>`;
  });

  /* Alle Termine in einer Ebene über den drei Spalten */
  const kacheln = evs.map(e => {
    const m = mem(e.member);
    const top = off[e.a] + e.zeile * RH;
    const hgt = off[e.b] - off[e.a] + RH;
    const n = e.c2 - e.c1 + 1;
    const li = (e.c1 / SLOTN * 100).toFixed(4), br = (n / SLOTN * 100).toFixed(4);
    const ganz = (n === SLOTN);
    const dehnbar = !!e.time && !(e.end && e.end > e.date);
    /* Je schmaler die Kachel, desto weniger Text passt hinein */
    const inhalt = `<i class="pk" style="background:${m.color}">${esc(ini(m))}</i>`
      + ((ganz || n >= 2) && e.time ? `<b>${e.time}</b>` : '')
      + (ganz || n >= 3 ? esc(e.title) : '');
    return `<div class="p-ev${dehnbar?' dehnbar':''}" data-ev="${e.id}" data-c1="${e.c1}" data-c2="${e.c2}"
      style="--pc:${m.color};background:${tint(m.color, .15)};
      top:${top + 2}px;height:${hgt - 4}px;
      left:calc(${li}% + 1px);width:calc(${br}% - 2px)"
      title="${esc(m.name)}: ${esc(e.title)}${e.time ? ' · '+e.time+(e.timeEnd?'–'+e.timeEnd:'') : ''}">${inhalt}${
        dehnbar ? `${n > 1 ? '<i class="rz rz-l" data-rz="l"></i>' : ''}<i class="rz rz-r" data-rz="r"></i>` : ''}</div>`;
  }).join('');
  html += `<div class="p-layer" style="grid-row:2/-1;grid-column:2/-1">${kacheln}</div>`;

  const rowsCss = Array.from({length:nDays}, (_,i) => hoehe(i+1) + 'px').join(' ');
  return `<div class="p-wrap"><div class="p-scroll"><div class="pgrid" data-days="${nDays}"
    data-y="${y}" data-mo="${mo}"
    style="grid-template-columns:var(--daycol) repeat(3,1fr);
           grid-template-rows:34px ${rowsCss}">${html}</div></div></div>`;
}

/* ---- Verschieben per Ziehen, funktioniert auch mit dem Finger ---- */
let dragState = null;
function initPlaner(){
  const grid = document.querySelector('.pgrid');
  if (!grid) return;
  const nDays = +grid.dataset.days, Y = +grid.dataset.y, MO = +grid.dataset.mo;
  const dayIso = d => `${Y}-${String(MO+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

  const layer = () => grid.querySelector('.p-layer');
  const bandAt = x => {
    const el = layer(); if (!el) return null;
    const r = el.getBoundingClientRect();
    if (x < r.left || x > r.right) return null;
    return Math.min(2, Math.max(0, Math.floor((x - r.left) / (r.width / 3))));
  };
  /* Stündliches Einrasten: sechs Schritte je Bereich */
  const timeAt = x => {
    const el = layer(); if (!el) return null;
    const r = el.getBoundingClientRect();
    if (x < r.left || x > r.right) return null;
    return hh(SLOT0 + Math.min(SLOTN-1, Math.max(0, Math.floor((x - r.left) / (r.width / SLOTN)))));
  };
  /* Linker Rand und Breite eines Stundenschritts, für die Zielanzeige */
  const slotGeo = zeit => ({ left: slotOf(+zeit.slice(0,2)) / SLOTN * 100, width: 100 / SLOTN });
  /* Stundenschritt unter dem Finger */
  const slotAt = x => {
    const el = layer(); if (!el) return null;
    const r = el.getBoundingClientRect();
    if (x < r.left) return 0;
    if (x > r.right) return SLOTN - 1;
    return Math.min(SLOTN-1, Math.max(0, Math.floor((x - r.left) / (r.width / SLOTN))));
  };
  const dayAt = y => {
    const el = layer(); if (!el) return 1;
    const rel = y - el.getBoundingClientRect().top;
    const off = (planerGeo && planerGeo.off) || null;
    if (!off) return Math.min(nDays, Math.max(1, Math.floor(rel / RH) + 1));
    for (let d = 1; d <= nDays; d++) if (rel < off[d+1]) return d;
    return nDays;
  };

  grid.addEventListener('pointerdown', e => {
    const lay = e.target.closest('.p-layer'); if (!lay) return;
    const evEl = e.target.closest('.p-ev');
    const griff = e.target.closest('.rz');
    dragState = { x:e.clientX, y:e.clientY, evEl, id:evEl && evEl.dataset.ev,
                  moved:false, drag:false, pid:e.pointerId };
    if (griff && evEl && may('events.edit')){
      /* Griffe brauchen kein langes Drücken */
      dragState.rz = griff.dataset.rz;
      dragState.drag = true;
      dragState.basis = { c1:+evEl.dataset.c1, c2:+evEl.dataset.c2 };
      document.body.classList.add('dragging');
      evEl.classList.add('dehnt');
      try { grid.setPointerCapture(e.pointerId); } catch(err){}
      return;
    }
    if (evEl && may('events.edit'))
      dragState.timer = setTimeout(() => beginDrag(e.clientX, e.clientY), 330);
  });

  let autoTimer = null;
  function autoScroll(){
    const st = dragState, box = document.querySelector('.p-scroll');
    if (!st || !st.drag || !box || !st.px){ autoTimer = null; return; }
    const r = box.getBoundingClientRect(), m = 46, step = 11;
    if (st.py < r.top + m)          box.scrollTop  -= step;
    else if (st.py > r.bottom - m)  box.scrollTop  += step;
    if (st.px < r.left + m)         box.scrollLeft -= step;
    else if (st.px > r.right - m)   box.scrollLeft += step;
    autoTimer = requestAnimationFrame(autoScroll);
  }

  function beginDrag(x, y){
    const st = dragState; if (!st || !st.evEl) return;
    st.drag = true;
    document.body.classList.add('dragging');
    const r = st.evEl.getBoundingClientRect();
    st.offX = x - r.left; st.offY = y - r.top; st.w = r.width; st.h = r.height;
    const quelle = S.events.find(o => o.id === st.id);
    st.hatZeit = !!(quelle && quelle.time);
    const g = st.evEl.cloneNode(true);
    g.className = 'p-ev drag-ghost';
    g.style.cssText = `--pc:${getComputedStyle(st.evEl).getPropertyValue('--pc')};
      background:${st.evEl.style.background};width:${r.width}px;height:${r.height}px;
      left:${r.left}px;top:${r.top}px`;
    document.body.appendChild(g);
    st.ghost = g; st.evEl.classList.add('ghosted');
    try { grid.setPointerCapture(st.pid); } catch(err){}
    if (navigator.vibrate) navigator.vibrate(12);
    if (!autoTimer) autoTimer = requestAnimationFrame(autoScroll);
  }

  grid.addEventListener('pointermove', e => {
    const st = dragState; if (!st) return;
    if (!st.drag){
      if (Math.hypot(e.clientX - st.x, e.clientY - st.y) > 10){ clearTimeout(st.timer); st.moved = true; }
      return;
    }
    e.preventDefault();
    if (st.rz){
      const i = slotAt(e.clientX); if (i === null) return;
      let c1 = st.basis.c1, c2 = st.basis.c2;
      if (st.rz === 'l') c1 = Math.min(i, c2); else c2 = Math.max(i, c1);
      st.neu = { c1, c2 };
      st.evEl.style.left  = `calc(${(c1/SLOTN*100).toFixed(4)}% + 1px)`;
      st.evEl.style.width = `calc(${((c2-c1+1)/SLOTN*100).toFixed(4)}% - 2px)`;
      st.evEl.setAttribute('title', hh(SLOT0+c1) + '–' + hh(SLOT0+c2+1));
      return;
    }
    st.px = e.clientX; st.py = e.clientY;
    st.ghost.style.left = (e.clientX - st.offX) + 'px';
    st.ghost.style.top  = (e.clientY - st.offY) + 'px';
    grid.querySelectorAll('.p-drop').forEach(n => n.remove());
    const lay = layer();
    const d = dayAt(e.clientY - st.offY + st.h / 2);
    if (lay && d){
      const c1 = +st.evEl.dataset.c1, c2 = +st.evEl.dataset.c2;
      const ganztags = (c1 === 0 && c2 === 2 && !st.hatZeit);
      const zeit = ganztags ? null : timeAt(e.clientX + (st.w / 2) - st.offX);
      const slot = document.createElement('div');
      slot.className = 'p-drop';
      slot.style.top = ((planerGeo ? planerGeo.off[d] : (d-1)*RH) + 2) + 'px';
      slot.style.height = st.h + 'px';
      if (ganztags || !zeit){
        slot.style.left = `calc(${(c1/3*100).toFixed(4)}% + 2px)`;
        slot.style.width = `calc(${((c2-c1+1)/3*100).toFixed(4)}% - 4px)`;
      } else {
        const g = slotGeo(zeit);
        slot.style.left = `calc(${g.left.toFixed(4)}% + 1px)`;
        slot.style.width = `calc(${g.width.toFixed(4)}% - 2px)`;
        slot.textContent = zeit;
      }
      lay.appendChild(slot);
      st.target = { day: d, zeit: ganztags ? null : zeit };
    } else st.target = null;
  });

  function finish(e){
    const st = dragState; if (!st) return;
    clearTimeout(st.timer);
    grid.querySelectorAll('.p-drop').forEach(n => n.remove());
    if (st.rz){
      document.body.classList.remove('dragging');
      if (st.evEl) st.evEl.classList.remove('dehnt');
      if (st.neu && st.id){
        const t = S.events.find(x => x.id === st.id);
        if (t){
          t.time = hh(SLOT0 + st.neu.c1);
          t.timeEnd = hh(SLOT0 + st.neu.c2 + 1);        // höchstens 23:00
          toast(`„${t.title}“ ${t.time}–${t.timeEnd}`);
        }
      }
      dragState = null; return render();
    }
    if (st.drag){
      if (autoTimer){ cancelAnimationFrame(autoTimer); autoTimer = null; }
      document.body.classList.remove('dragging');
      if (st.ghost) st.ghost.remove();
      if (st.evEl) st.evEl.classList.remove('ghosted');
      if (st.target && st.id){
        const t = S.events.find(x => x.id === st.id);
        if (t){
          const span = t.end && t.end > t.date
            ? Math.round((new Date(t.end+'T00:00') - new Date(t.date+'T00:00')) / 86400000) : 0;
          const nd = dayIso(st.target.day);
          t.date = nd;
          if (span) t.end = iso(addDays(new Date(nd+'T00:00'), span));
          if (st.target.zeit && t.time){
            const min = z => +z.slice(0,2)*60 + +z.slice(3,5);
            const diff = min(st.target.zeit) - min(t.time);
            t.time = st.target.zeit;
            if (t.timeEnd){
              const e2 = Math.max(0, Math.min(23*60+59, min(t.timeEnd) + diff));
              t.timeEnd = String(Math.floor(e2/60)).padStart(2,'0') + ':' + String(e2%60).padStart(2,'0');
            }
          }
          toast(`„${t.title}“ → ${fmtDay(nd)}${t.time ? ', ' + t.time : ''}`);
        }
      }
      dragState = null; return render();
    }
    if (!st.moved){
      if (st.id){
        if (!may('events.edit')) { dragState = null; return deny(); }
        dragState = null; return openSheet('editev', { id: st.id });
      }
      const d = dayAt(e.clientY);
      S.ui.calSel = dayIso(d);
      if (!may('events.edit')){ dragState = null; return render(); }
      const pre = { date: dayIso(d), time: timeAt(e.clientX) || '' };
      dragState = null; render(); return openSheet('event', pre);
    }
    dragState = null;
  }
  /* Entscheidend fürs iPhone: Solange gezogen wird, ist die Bewegung
     ausdrücklich kein Scrollen. Muss passive:false sein, sonst ignoriert
     Safari das Abwehren. */
  grid.addEventListener('touchmove', e => {
    if (dragState && dragState.drag) e.preventDefault();
  }, { passive:false });

  /* Langes Drücken darf keine Textauswahl oder das iOS-Menü auslösen */
  grid.addEventListener('contextmenu', e => { if (dragState) e.preventDefault(); });

  grid.addEventListener('pointerup', finish);
  grid.addEventListener('pointercancel', () => {
    const st = dragState;
    if (st && st.drag){
      toast('Verschieben abgebrochen. Tippe den Termin an, um ihn dort zu ändern.');
      if (autoTimer){ cancelAnimationFrame(autoTimer); autoTimer = null; }
      document.body.classList.remove('dragging');
      if (st.ghost) st.ghost.remove();
      if (st.evEl) st.evEl.classList.remove('ghosted');
      grid.querySelectorAll('.p-drop').forEach(n => n.remove());
    }
    dragState = null;
  });
}

    <div class="field"><label for="f-mail">E-Mail der Anmeldung, verbindet den Zugang mit dieser Person</label>
      <input id="f-mail" type="email" inputmode="email" value="${esc(m.email||'')}" placeholder="z. B. paul@ruch.ch"></div>
    <div class="actions">
      ${kind==='editmem' ? `<button class="btn ghost" data-delmem="${pre.id}">Löschen</button>` : '<button class="btn ghost" data-close>Abbrechen</button>'}
      <button class="btn" data-save="member">Sichern</button></div>`;
    })()
  : kind === 'reason' || kind === 'editreason' ? (() => {
      const r = kind==='editreason' ? (S.reasons.find(x => x.id === pre.id) || {}) : { text:'', amount:.5 };
      editId = kind==='editreason' ? pre.id : null;
      return `
    <h3>${kind==='editreason' ? 'Grund bearbeiten' : 'Neuer Strichgrund'}</h3>
    <div class="field"><label for="f-rtext">Grund</label><input id="f-rtext" value="${esc(r.text||'')}" placeholder="z. B. Znüni vergessen"></div>
    <div class="field"><label for="f-ramt">Abzug in CHF</label><input id="f-ramt" type="number" step="0.5" min="0" value="${r.amount!=null?r.amount:0.5}"></div>
    <div class="actions">
      ${kind==='editreason' ? `<button class="btn ghost" data-delreason="${pre.id}">Löschen</button>` : '<button class="btn ghost" data-close>Abbrechen</button>'}
      <button class="btn" data-save="reason">Sichern</button></div>`;
    })()
  : kind === 'menu' ? `
    <h3>Neues Menü</h3>
    <div class="field"><label for="f-day">Tag</label><select id="f-day">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<option>${d}</option>`).join('')}</select></div>
    <div class="field"><label for="f-meal">Gericht</label><input id="f-meal" placeholder="z. B. Älplermagronen"></div>
    <div class="field"><label for="f-zut">Zutaten, mit Komma getrennt</label><input id="f-zut" placeholder="Hörnli, Kartoffeln, Apfelmus"></div>
    <div class="actions"><button class="btn ghost" data-close>Abbrechen</button><button class="btn" data-save="menu">Menü sichern</button></div>`
  : `
    <h3>Neuer Schuleintrag</h3>
    <div class="field"><label for="f-kind">Art</label><select id="f-kind">
      <option value="hausaufgabe">Hausaufgabe</option><option value="pruefung">Prüfung</option></select></div>
    <div class="field"><label for="f-mem">Kind</label><select id="f-mem">${KIDS.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select></div>
    <div class="field two">
      <div style="flex:1"><label for="f-subj">Fach</label><input id="f-subj" placeholder="Mathe"></div>
      <div style="flex:1"><label for="f-due">Bis</label><input id="f-due" type="date" value="${D(1)}"></div>
    </div>
    <div class="field"><label for="f-title">Was genau</label><input id="f-title" placeholder="Arbeitsblatt 12"></div>
    <div class="actions"><button class="btn ghost" data-close>Abbrechen</button><button class="btn" data-save="school">Eintrag sichern</button></div>`;
  const sh = $('#sheet'); sh.innerHTML = html;
  sh.classList.add('open'); $('#scrim').classList.add('open');
  wirePhoto();
  setTimeout(() => { const f = sh.querySelector('input:not([type=file])'); if (f) f.focus(); }, 200);
}
let pendingPhoto;   // undefined = unverändert, null = entfernen, String = neues Foto
function wirePhoto(){
  pendingPhoto = undefined;
  const inp = document.getElementById('f-photo'),
        btn = document.getElementById('f-photobtn'),
        del = document.getElementById('f-photodel'),
        pre = document.getElementById('f-prev');
  if (!inp || !btn) return;
  btn.addEventListener('click', () => inp.click());
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    try {
      const url = await scaleImage(f);
      pendingPhoto = url;
      pre.style.backgroundImage = `url('${url}')`;
      pre.style.backgroundSize = 'cover'; pre.style.backgroundPosition = 'center';
      pre.textContent = '';
      btn.textContent = 'Foto ersetzen';
    } catch (err) { toast('Bild konnte nicht gelesen werden.'); }
  });
  if (del) del.addEventListener('click', () => {
    pendingPhoto = null;
    pre.style.backgroundImage = 'none'; pre.textContent = '';
    del.remove(); btn.textContent = 'Foto wählen';
  });
}
function closeSheet(){ $('#sheet').classList.remove('open'); $('#scrim').classList.remove('open'); }

/* ============ Ereignisse ============ */
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  const d = t.dataset;

  if (d.tab){ tab = d.tab; window.scrollTo(0,0); return render(); }
  if (d.go){ tab = d.go; window.scrollTo(0,0); return render(); }
  if ('reset' in d){
    if (!confirm('Alle Einträge löschen? Die Termine aus dem Papierkalender werden neu eingelesen, alles andere ist weg.')) return;
    S = seed(); refreshMembers(); applyImport(); return render();
  }
  if ('close' in d) return closeSheet();
  if (d.sheet) return openSheet(d.sheet);

  if (d.loginpick){ loginPick = d.loginpick; loginManual = false; return showLogin(); }
  if ('loginback' in d){ loginPick = null; loginManual = false; return showLogin(); }
  if ('loginmanual' in d){ loginPick = null; loginManual = true; return showLogin(); }
  if ('mic' in d){ return speechAn(); }
  if ('dologin' in d){ return doLogin(); }
  if ('logout' in d){ return logout(); }
  if ('uploadlocal' in d){ if (!may('admin')) return deny();
    uploadLocal().then(ok => { if (ok) render(); }); return; }
  if ('reimport' in d){ if (!may('admin')) return deny();
    const vorher = S.events.length;
    S.imported = []; applyImport();
    toast(`${S.events.length - vorher} Termine ergänzt.`); return render(); }
  if (d.me){ return toast('Die Person ergibt sich aus der Anmeldung.'); }
  if (d.perm){ if (!may('admin')) return deny();
    const [k,v] = d.perm.split('|'); S.perms[k] = v; return render(); }
  if (d.editmem){ if (!may('admin')) return deny(); return openSheet('editmem', { id:d.editmem }); }
  if (d.delmem){ if (!may('admin')) return deny();
    if (S.members.length <= 1) return toast('Die letzte Person lässt sich nicht löschen.');
    if (!confirm('Person löschen? Ihre Termine bleiben bestehen und werden als „Unbekannt“ angezeigt.')) return;
    S.members = S.members.filter(m => m.id !== d.delmem);
    if (S.me === d.delmem) S.me = S.members[0].id;
    refreshMembers(); closeSheet(); return render(); }
  if (d.editreason){ if (!may('admin')) return deny(); return openSheet('editreason', { id:d.editreason }); }
  if (d.delreason){ if (!may('admin')) return deny();
    S.reasons = S.reasons.filter(r => r.id !== d.delreason); closeSheet(); return render(); }
  if (d.interval){ if (!may('admin')) return deny(); S.allowance.interval = d.interval; return render(); }
  if (d.payday){ if (!may('admin')) return deny(); S.allowance.day = +d.payday; return render(); }
  if (d.editev){ if (!may('events.edit')) return deny(); return openSheet('editev', { id:d.editev }); }
  if ('today' in d){ S.ui.calMonth = TODAY.getMonth(); S.ui.calYear = TODAY.getFullYear();
    S.ui.calSel = TODAY_ISO; letzterTab = null; return render(); }
  if (d.mon){ let m = S.ui.calMonth + (+d.mon); if (m < 0){ m = 11; S.ui.calYear--; } if (m > 11){ m = 0; S.ui.calYear++; } S.ui.calMonth = m; letzterTab = null; return render(); }
  if (d.day){ S.ui.calSel = d.day; const dd = new Date(d.day+'T00:00'); S.ui.calMonth = dd.getMonth(); S.ui.calYear = dd.getFullYear(); return render(); }
  if (d.filter){ S.ui.calFilter = d.filter; return render(); }
  if (d.delev){ if (!may('events.edit')) return deny();
    S.events = S.events.filter(x => x.id !== d.delev); closeSheet(); return render(); }

  if (d.list){ S.ui.list = d.list; return render(); }
  if ('hidedone' in d){ S.ui.hideDone = !S.ui.hideDone; return render(); }
  if (d.item){ if (!may('shop.edit')) return deny();
    const l = S.lists.find(l=>l.id===S.ui.list); const i = l.items.find(i=>i.id===d.item); i.done = !i.done; return render(); }
  if (d.delitem){ if (!may('shop.edit')) return deny();
    const l = S.lists.find(l=>l.id===S.ui.list); l.items = l.items.filter(i=>i.id!==d.delitem); return render(); }
  if ('additem' in d){ addItem(); return; }
  if (d.menu){
    const l = S.lists.find(l=>l.id===S.ui.list);
    S.menu[+d.menu].zutaten.forEach(z => {
      if (!l.items.some(i => i.text.toLowerCase() === z.toLowerCase()))
        l.items.push({ id:uid(), text:z, done:false, by:S.me });
    });
    return render();
  }

  if (d.sfilter){ S.ui.schoolFilter = d.sfilter; return render(); }
  if (d.hw){ const h = S.school.find(x=>x.id===d.hw);
    if (!may('school.check', h.member)) return deny();
    h.done = !h.done; return render(); }

  if (d.chore){
    const c = S.chores.find(x=>x.id===d.chore);
    if (!may('chores.check', c.member)) return deny();
    c.done = c.done.includes(TODAY_ISO) ? c.done.filter(x=>x!==TODAY_ISO) : [...c.done, TODAY_ISO];
    return render();
  }
  if (d.delchore){ if (!may('chores.edit')) return deny();
    S.chores = S.chores.filter(c => c.id !== d.delchore); return render(); }
  if (d.delmenu){ S.menu.splice(+d.delmenu, 1); return render(); }
  if (d.strike){ if (!may('strikes.set')) return deny();
    const [mid, rid] = d.strike.split('|');
    const r = S.reasons.find(x => x.id === rid); if (!r) return;
    S.strikes.push({ id:uid(), member:mid, reasonId:r.id, reason:r.text, date:TODAY_ISO, amount:r.amount });
    return render(); }
  if (d.unstrike){ if (!may('strikes.set')) return deny();
    S.strikes = S.strikes.filter(s=>s.id!==d.unstrike); return render(); }

  if ('send' in d) return sendMsg();

  if (d.save === 'event'){
    const title = $('#f-title').value.trim(); if (!title) return $('#f-title').focus();
    const end = $('#f-end').value;
    S.events.push({ id:uid(), title, member:$('#f-mem').value, date:$('#f-date').value,
      time:$('#f-time').value, timeEnd:$('#f-timeend').value, place:$('#f-place').value.trim(),
      ...(end && end > $('#f-date').value ? { end } : {}) });
    S.ui.calSel = $('#f-date').value; closeSheet(); return render();
  }
  if (d.save === 'editev'){
    const t = S.events.find(x => x.id === editId); if (!t) return closeSheet();
    const title = $('#f-title').value.trim(); if (!title) return $('#f-title').focus();
    const end = $('#f-end').value;
    t.title = title; t.member = $('#f-mem').value; t.date = $('#f-date').value;
    t.time = $('#f-time').value; t.place = $('#f-place').value.trim();
    const te = $('#f-timeend').value; if (te) t.timeEnd = te; else delete t.timeEnd;
    if (end && end > t.date) t.end = end; else delete t.end;
    closeSheet(); return render();
  }
  if (d.save === 'member'){
    const name = $('#f-name').value.trim(); if (!name) return $('#f-name').focus();
    const role = $('#f-role').value;
    const allow = parseFloat($('#f-allow').value);
    const data = { name, role, color:$('#f-color').value,
                   ...(role==='kid' ? { allowance: isNaN(allow) ? 0 : allow } : {}) };
    if (editId){
      const m = S.members.find(x => x.id === editId);
      Object.assign(m, data); if (role !== 'kid') delete m.allowance;
      if (pendingPhoto === null) delete m.photo;
      else if (pendingPhoto) m.photo = pendingPhoto;
      const mail = $('#f-mail').value.trim(); if (mail) m.email = mail; else delete m.email;
      delete m.pin;
    } else {
      const mail = $('#f-mail').value.trim();
      S.members.push({ id:'m'+uid(), ...data,
        ...(pendingPhoto ? { photo:pendingPhoto } : {}), ...(mail ? { email:mail } : {}) });
    }
    refreshMembers(); closeSheet(); return render();
  }
  if (d.save === 'reason'){
    const text = $('#f-rtext').value.trim(); if (!text) return $('#f-rtext').focus();
    const amt = parseFloat($('#f-ramt').value);
    const val = { text, amount: isNaN(amt) ? 0.5 : amt };
    if (editId) Object.assign(S.reasons.find(r => r.id === editId), val);
    else S.reasons.push({ id:'r'+uid(), ...val });
    closeSheet(); return render();
  }
  if (d.save === 'chore'){
    const title = $('#f-title').value.trim(); if (!title) return $('#f-title').focus();
    S.chores.push({ id:uid(), member:$('#f-mem').value, title,
      rhythm:$('#f-rhythm').value.trim() || 'täglich', done:[] });
    closeSheet(); return render();
  }
  if (d.save === 'menu'){
    const meal = $('#f-meal').value.trim(); if (!meal) return $('#f-meal').focus();
    S.menu.push({ id:'n'+uid(), day:$('#f-day').value, meal,
      zutaten:$('#f-zut').value.split(',').map(z => z.trim()).filter(Boolean) });
    closeSheet(); return render();
  }
  if (d.save === 'school'){
    const title = $('#f-title').value.trim(); if (!title) return $('#f-title').focus();
    S.school.push({ id:uid(), kind:$('#f-kind').value, member:$('#f-mem').value,
      subject:$('#f-subj').value.trim() || 'Allgemein', title, due:$('#f-due').value, done:false });
    closeSheet(); return render();
  }
});

$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
document.addEventListener('keypress', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'loginPass' || e.target.id === 'loginMail') doLogin();
  if (e.target.id === 'shopInput') addItem();
  if (e.target.id === 'chatInput') sendMsg();
});

function addItem(){
  const el = $('#shopInput'); const v = el.value.trim(); if (!v) return el.focus();
  if (!may('shop.edit')) return deny();
  S.lists.find(l => l.id === S.ui.list).items.push({ id:uid(), text:v, done:false, by:S.me });
  render(); $('#shopInput').focus();
}
function sendMsg(){
  const el = $('#chatInput'); const v = el.value.trim(); if (!v) return el.focus();
  const now = new Date();
  if (!may('chat.write')) return deny();
  S.chat.push({ id:uid(), member:S.me, text:v,
    t:`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}` });
  render(); $('#chatInput').focus();
}

/* Hell / Dunkel */
function paintTheme(){
  const dark = document.documentElement.dataset.theme === 'dark' ||
    (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  $('#themeBtn').innerHTML = icon(dark ? 'sun' : 'moon', 19);
}
try { const th = localStorage.getItem(KEY+'-theme'); if (th) document.documentElement.dataset.theme = th; } catch(e){}
$('#themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const nxt = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = nxt;
  try { localStorage.setItem(KEY+'-theme', nxt); } catch(e){}
  paintTheme();
});

$('#meBtn').innerHTML = icon('user',19);
$('#meBtn').addEventListener('click', () => {
  tab = tab === 'profil' ? 'home' : 'profil'; window.scrollTo(0,0); render();
});
paintTheme();
boot();

/* Offline-Fähigkeit: läuft nur auf https, lokal wird es still übersprungen */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
