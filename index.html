<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruchs Organisations App</title>
<meta name="description" content="Kalender, Einkauf, Schule und Ämtli für Ka, Pädu, Anna, Moritz und Paul.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ruchs App">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141714" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png" sizes="512x512" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F2EC;
  --surface:#FFFFFF;
  --surface-2:#F7F8F3;
  --ink:#1C2621;
  --muted:#6E7670;
  --line:#DDE0D6;
  --line-soft:#E9EBE3;
  --alert:#B33B2E;
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 -1px 0 var(--line), 0 -8px 24px rgba(28,38,33,.06);
  --pad:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141714;
    --surface:#1D211D;
    --surface-2:#232823;
    --ink:#E9EDE6;
    --muted:#98A197;
    --line:#2E342E;
    --line-soft:#272C27;
    --alert:#E0705F;
    --shadow:0 -1px 0 var(--line), 0 -8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#141714; --surface:#1D211D; --surface-2:#232823;
  --ink:#E9EDE6; --muted:#98A197; --line:#2E342E; --line-soft:#272C27;
  --alert:#E0705F; --shadow:0 -1px 0 var(--line), 0 -8px 24px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;height:100%;
  background:var(--paper);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.num{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;font-weight:600;letter-spacing:-.015em;margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- Shell ---------- */
.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:var(--paper);border-bottom:1px solid var(--line-soft);
  padding:12px var(--pad) 10px;
  display:flex;align-items:baseline;gap:10px;justify-content:space-between;
}
.topbar .date{font-size:12.5px;color:var(--muted)}
.topbar h1{font-size:20px}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
main{flex:1;padding:var(--pad) var(--pad) 96px}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--surface);box-shadow:var(--shadow);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  display:flex;
}
.tabbar-inner{max-width:760px;margin:0 auto;display:flex;width:100%}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:10.5px;font-weight:500}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .tabdot{opacity:1}
.tabdot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:0;margin-top:-1px}
.tab svg{width:21px;height:21px}

/* ---------- Bausteine ---------- */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px}
.card + .card{margin-top:12px}
.sec{margin-top:26px}
.sec:first-child{margin-top:4px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-head h2{font-size:16px}
.sec-head .hint{font-size:12.5px;color:var(--muted)}
.linkbtn{font-size:13px;font-weight:500;color:var(--muted);padding:4px 8px;border-radius:8px}
.linkbtn:hover{background:var(--surface-2);color:var(--ink)}
.btn{background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:999px;font-size:14px;font-weight:500}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:active{transform:translateY(1px)}
.empty{color:var(--muted);font-size:13.5px;padding:14px;border:1px dashed var(--line);border-radius:var(--radius);text-align:center}

.avatar{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;
  color:#fff;font-weight:600;font-size:12.5px;letter-spacing:-.01em;font-family:"Bricolage Grotesque",sans-serif;
}
.avatar.sm{width:24px;height:24px;font-size:9.5px}
.avatar.lg{width:44px;height:44px;font-size:15.5px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin:0 calc(var(--pad)*-1);padding-left:var(--pad);padding-right:var(--pad);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none;
  border:1px solid var(--line);background:var(--surface);
  padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);
}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}

/* Heute-Streifen */
.today-strip{display:flex;gap:8px;overflow-x:auto;margin:0 calc(var(--pad)*-1);padding:2px var(--pad) 6px;scrollbar-width:none}
.today-strip::-webkit-scrollbar{display:none}
.person-col{
  flex:none;width:138px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--radius);padding:12px;border-top:3px solid var(--pc);
}
.person-col .nm{font-size:13px;font-weight:600;margin-top:8px}
.person-col .nx{font-size:12.5px;color:var(--muted);margin-top:4px;min-height:34px}
.person-col .tm{font-family:"Bricolage Grotesque",sans-serif;font-size:15px;font-weight:600;margin-top:6px}

/* Zeilen */
.row{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:none}
.row .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--pc);flex:none;min-height:34px}
.row .body{flex:1;min-width:0}
.row .t{font-size:14.5px;font-weight:500;line-height:1.3}
.row .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.row .r{font-family:"Bricolage Grotesque",sans-serif;font-size:14px;font-weight:600;white-space:nowrap;padding-top:1px}
.row.done .t{text-decoration:line-through;color:var(--muted)}

.check{
  width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex:none;
  display:grid;place-items:center;margin-top:1px;background:var(--surface);
}
.check[aria-pressed="true"]{background:var(--pc,var(--ink));border-color:var(--pc,var(--ink))}
.check svg{width:13px;height:13px;color:#fff;opacity:0}
.check[aria-pressed="true"] svg{opacity:1}

/* Kalender */
.cal{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:10px 8px 8px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 10px}
.cal-head .mon{font-family:"Bricolage Grotesque",sans-serif;font-size:16px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{text-align:center;font-size:11px;color:var(--muted);padding-bottom:4px;font-weight:500}
.day{aspect-ratio:1/1.08;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;gap:3px;font-size:13px;position:relative}
.day.out{color:var(--line)}
.day.today{background:var(--surface-2);font-weight:600}
.day[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.day .pips{display:flex;gap:2px;position:absolute;bottom:6px}
.day .pip{width:4px;height:4px;border-radius:50%}
.day[aria-pressed="true"] .pip{box-shadow:0 0 0 1px var(--paper)}

/* Planer: Tage als Zeilen, Personen als Spalten */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{padding:5px 13px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.p-wrap{margin:12px calc(var(--pad)*-1) 0;background:var(--surface);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.p-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.pgrid{display:grid;min-width:max-content;--rh:34px}
.p-corner,.p-hcell{position:sticky;top:0;z-index:5;background:var(--surface);
  border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:12px;font-weight:600;font-family:"Bricolage Grotesque",sans-serif}
.p-corner{left:0;z-index:6}
.p-hcell{border-left:1px solid var(--line-soft)}
.p-hcell i{width:7px;height:7px;border-radius:50%}
.p-stripe{grid-column:1/-1;z-index:0;background:var(--surface-2)}
.p-stripe.hol{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-soft)}
.p-day{position:sticky;left:0;z-index:4;background:var(--surface);
  display:flex;align-items:center;gap:5px;padding:0 6px;font-size:12.5px;
  border-right:1px solid var(--line);text-align:left;width:100%}
.p-day.we{background:var(--surface-2)}
.p-day b{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:14px;min-width:17px;text-align:right}
.p-day span{color:var(--muted);font-size:11px}
.p-day u{margin-left:auto;color:var(--muted);font-size:9.5px;text-decoration:none;font-variant-numeric:tabular-nums}
.p-day.red b{color:var(--alert)}
.p-day[aria-pressed="true"]{background:var(--ink)}
.p-day[aria-pressed="true"] b,.p-day[aria-pressed="true"] span,.p-day[aria-pressed="true"] u{color:var(--paper)}
.p-col{position:relative;z-index:1;border-left:1px solid var(--line-soft);
  background-image:repeating-linear-gradient(to bottom,var(--line-soft) 0 1px,transparent 1px var(--rh))}
.p-ev{position:absolute;border-radius:5px;padding:2px 5px;font-size:11px;line-height:1.25;
  overflow:hidden;border-left:2.5px solid var(--pc);color:var(--ink)}
.p-ev b{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;margin-right:3px}
.p-legend{font-size:11.5px;color:var(--muted);margin-top:8px;text-align:center}

/* Einkauf */
.addbar{display:flex;gap:8px;align-items:center;padding:10px 0 2px}
.addbar input{
  flex:1;background:var(--surface-2);border:1px solid var(--line-soft);
  border-radius:10px;padding:10px 12px;font-size:14.5px;min-width:0;
}
.addbar input::placeholder{color:var(--muted)}
.qty{font-size:12.5px;color:var(--muted)}

/* Sackgeld */
.money{display:flex;align-items:flex-end;gap:8px;margin-top:2px}
.money .big{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;font-weight:700;line-height:1}
.money .was{font-size:13px;color:var(--muted);text-decoration:line-through;padding-bottom:3px}
.ledger{margin-top:10px;border-top:1px solid var(--line-soft);padding-top:8px}
.ledger .li{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;color:var(--muted)}
.ledger .li b{font-weight:500;color:var(--alert);font-family:"Bricolage Grotesque",sans-serif}
.tallybtns{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.tallybtn{border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--muted)}
.tallybtn:hover{border-color:var(--ink);color:var(--ink)}
.strikes{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:1px;font-size:15px;color:var(--alert)}

/* Chat */
.chatwrap{display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;display:flex;gap:9px;align-items:flex-end}
.msg .bub{background:var(--surface);border:1px solid var(--line-soft);padding:9px 12px;border-radius:14px 14px 14px 4px;font-size:14.5px}
.msg .who{font-size:11.5px;color:var(--muted);margin-bottom:2px;font-weight:500}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:var(--ink);color:var(--paper);border-color:var(--ink);border-radius:14px 14px 4px 14px}
.chatbar{display:flex;gap:8px;margin-top:16px;position:sticky;bottom:0;background:var(--paper);padding:8px 0}
.chatbar input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 15px;min-width:0}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(20,26,22,.42);z-index:50;display:none}
.scrim.open{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);
  border-radius:18px 18px 0 0;padding:18px var(--pad) calc(22px + env(safe-area-inset-bottom,0px));
  max-width:760px;margin:0 auto;transform:translateY(100%);transition:transform .22s ease;
  max-height:88vh;overflow-y:auto;
}
.sheet.open{transform:translateY(0)}
.sheet h3{font-size:17px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px}
.field .two{display:flex;gap:10px}
.sheet .actions{display:flex;gap:10px;margin-top:18px}
.sheet .actions .btn{flex:1;text-align:center}

.footnote{margin-top:28px;text-align:center;font-size:12px;color:var(--muted)}
.footnote button{text-decoration:underline;color:var(--muted);font-size:12px}

@media (min-width:720px){
  main{padding:22px 22px 110px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  .cols .sec{margin-top:0}
  .cols .sec + .sec{margin-top:26px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="date" id="topDate"></div>
      <h1 id="topTitle">Startseite</h1>
    </div>
    <button class="iconbtn" id="themeBtn" title="Hell / Dunkel" aria-label="Hell oder Dunkel umschalten"></button>
  </header>
  <main id="view"></main>
  <nav class="tabbar"><div class="tabbar-inner" id="tabs"></div></nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<script>
"use strict";

/* ============ Icons ============ */
const I = {
  home:'<path d="M3 10.2 12 3l9 7.2V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  cart:'<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 11.4a1.5 1.5 0 0 0 1.5 1.1h8.1a1.5 1.5 0 0 0 1.5-1.2L21 7H6"/>',
  book:'<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v16H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v4H6.5A2.5 2.5 0 0 1 4 20.5z"/>',
  star:'<path d="m12 3 2.6 5.5 5.9.8-4.3 4.2 1 6-5.2-2.8L6.8 19.5l1-6L3.5 9.3l5.9-.8z"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/>',
  check:'<path d="m4 12 5 5L20 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  left:'<path d="m15 5-7 7 7 7"/>',
  right:'<path d="m9 5 7 7-7 7"/>',
  sun:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.2 4.2l1.5 1.5M18.3 18.3l1.5 1.5M2 12h2M20 12h2M4.2 19.8l1.5-1.5M18.3 5.7l1.5-1.5"/>',
  moon:'<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>',
  pin:'<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>'
};
const icon = (n, s = 20) =>
  `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

/* ============ Stammdaten ============ */
const MEMBERS = [
  { id:'ka',     name:'Ka',     ini:'Ka', color:'#6B3FA0', kid:false },
  { id:'paedu',  name:'Pädu',   ini:'Pä', color:'#1E3A6E', kid:false },
  { id:'anna',   name:'Anna',   ini:'An', color:'#D9558B', kid:true, age:13 },
  { id:'moritz', name:'Moritz', ini:'Mo', color:'#5C6670', kid:true, age:10 },
  { id:'paul',   name:'Paul',   ini:'Pa', color:'#1F8A5B', kid:true, age:6 },
  { id:'gemeinsam', name:'Gemeinsam', ini:'Ge', color:'#A5701F', kid:false, shared:true }
];
const M = Object.fromEntries(MEMBERS.map(m => [m.id, m]));
const KIDS = MEMBERS.filter(m => m.kid);

const TODAY = new Date(2026, 8, 20);           // So, 20.09.2026
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const TODAY_ISO = iso(TODAY);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const WDL = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MON = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const fmtDay = s => { const d = new Date(s+'T00:00'); return `${WD[d.getDay()]}, ${d.getDate()}. ${MON[d.getMonth()].slice(0,3)}`; };
const daysUntil = s => Math.round((new Date(s+'T00:00') - TODAY) / 86400000);
const relDay = s => { const n = daysUntil(s); return n===0 ? 'Heute' : n===1 ? 'Morgen' : n===-1 ? 'Gestern' : fmtDay(s); };
const chf = n => (n<0?'−':'') + 'CHF ' + Math.abs(n).toFixed(2);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D = n => iso(addDays(TODAY, n));

/* ============ Demodaten ============ */
function seed(){ return {
  events: [],
  lists: [
    { id:'migros', name:'Migros',   items:[] },
    { id:'coop',   name:'Coop',     items:[] },
    { id:'drog',   name:'Drogerie', items:[] }
  ],
  menu: [],
  school: [],
  chores: [],
  strikes: [],
  chat: [],
  imported: [],
  cleaned: true,
  ui: { calView:'planer', list:'migros', calMonth:TODAY.getMonth(), calYear:TODAY.getFullYear(),
        calSel:TODAY_ISO, calFilter:'alle', schoolFilter:'alle', hideDone:false }
};}

const REASONS = [
  { r:'Znüni vergessen', a:.5 }, { r:'Turnsack vergessen', a:.5 },
  { r:'Ämtli nicht gemacht', a:1 }, { r:'Handy am Tisch', a:.5 },
  { r:'Zimmer nicht aufgeräumt', a:.5 }
];
const SACKGELD = { anna:13, moritz:10, paul:6 };   // CHF pro Woche, Auszahlung sonntags


/* ============ Termine aus dem Papierkalender ============ */

  IMPORT.forEach(e => {
    if (!S.imported.includes(e.id)){ S.events.push({ ...e }); S.imported.push(e.id); }

const ev = (a,b) => (a.time||'').localeCompare(b.time||'');
const eventsOn = d => S.events.filter(e => e.date === d).sort(ev);
const av = (id, cls='') => { const m = M[id]; return `<span class="avatar ${cls}" style="background:${m.color}">${m.ini}</span>`; };
function thisWeek(){ // Mo–So der laufenden Woche
  const off = (TODAY.getDay() + 6) % 7;
  return Array.from({length:7}, (_,i) => iso(addDays(TODAY, -off + i)));
}
const WEEK = thisWeek();
const strikesOf = id => S.strikes.filter(s => s.member===id && WEEK.includes(s.date));
const deduction = id => strikesOf(id).reduce((n,s) => n + s.amount, 0);
const payout = id => Math.max(0, (SACKGELD[id]||0) - deduction(id));
const choresOf = id => S.chores.filter(c => c.member === id);
const openChoresToday = id => choresOf(id).filter(c => !c.done.includes(TODAY_ISO)).length;

/* Kalenderwoche nach ISO */
function isoWeek(d){
  const t = new Date(d); t.setHours(0,0,0,0);
  t.setDate(t.getDate() + 3 - ((t.getDay()+6)%7));
  const w1 = new Date(t.getFullYear(), 0, 4);
  return 1 + Math.round(((t - w1)/86400000 - 3 + ((w1.getDay()+6)%7)) / 7);
}
/* Ostersonntag, daraus die beweglichen Feiertage */
function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
        f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
        i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
        mm=Math.floor((h+l-7*m+114)/31),dd=((h+l-7*m+114)%31)+1;
  return new Date(y, mm-1, dd);
}
const holCache = {};
function holidays(y){
  if (holCache[y]) return holCache[y];
  const E = easter(y), o = n => iso(addDays(E, n)), P = m => `${y}-${m}`;
  const h = {};
  h[P('01-01')]='Neujahr'; h[P('01-02')]='Berchtoldstag';
  h[o(-2)]='Karfreitag'; h[o(0)]='Ostern'; h[o(1)]='Ostermontag';
  h[P('05-01')]='Tag der Arbeit'; h[o(39)]='Auffahrt'; h[o(50)]='Pfingstmontag';
  h[P('08-01')]='Nationalfeiertag'; h[P('12-25')]='Weihnachten'; h[P('12-26')]='Stephanstag';
  return holCache[y] = h;
}
/* Hexfarbe leicht eingefärbt als Hintergrund */
function tint(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}
const evEnd = e => e.end && e.end > e.date ? e.end : e.date;

/* ============ Kalender ============ */
function planerHTML(){
  const y = S.ui.calYear, mo = S.ui.calMonth, filt = S.ui.calFilter;
  const nDays = new Date(y, mo+1, 0).getDate();
  const cols = filt === 'alle' ? MEMBERS : MEMBERS.filter(m => m.id === filt);
  const hol = holidays(y);
  const first = `${y}-${String(mo+1).padStart(2,'0')}-01`;
  const last  = `${y}-${String(mo+1).padStart(2,'0')}-${String(nDays).padStart(2,'0')}`;

  /* Kopfzeile */
  let html = `<div class="p-corner" style="grid-area:1/1">KW</div>`;
  cols.forEach((m, i) => {
    html += `<div class="p-hcell" style="grid-row:1;grid-column:${i+2}">
      <i style="background:${m.color}"></i>${m.name}</div>`;
  });

  /* Streifen für Wochenenden und Feiertage */
  for (let d = 1; d <= nDays; d++){
    const dt = new Date(y, mo, d), k = iso(dt), wd = dt.getDay();
    if (wd === 0 || wd === 6 || hol[k])
      html += `<div class="p-stripe ${hol[k]?'hol':''}" style="grid-row:${d+1}"></div>`;
  }

  /* Tagesspalte */
  for (let d = 1; d <= nDays; d++){
    const dt = new Date(y, mo, d), k = iso(dt), wd = dt.getDay();
    const kw = wd === 1 ? isoWeek(dt) : '';
    html += `<button class="p-day ${(wd===0||wd===6)?'we':''} ${(wd===0||hol[k])?'red':''}"
      style="grid-row:${d+1};grid-column:1" data-day="${k}"
      ${k===S.ui.calSel?'aria-pressed="true"':''} ${hol[k]?`title="${hol[k]}"`:''}>
      <b>${d}</b><span>${WD[wd]}</span><u>${kw}</u></button>`;
  }

  /* Personenspalten mit den Einträgen */
  cols.forEach((m, ci) => {
    const evs = S.events
      .filter(e => e.member === m.id && e.date <= last && evEnd(e) >= first)
      .map(e => {
        const s0 = e.date < first ? 1 : new Date(e.date+'T00:00').getDate();
        const s1 = evEnd(e) > last ? nDays : new Date(evEnd(e)+'T00:00').getDate();
        return { ...e, a: s0, b: s1 };
      })
      .sort((x, y2) => x.a - y2.a || (y2.b - y2.a) - (x.b - x.a));

    /* Spuren berechnen, damit sich Überlappendes nebeneinander legt */
    const lanes = [];
    evs.forEach(e => {
      let l = lanes.findIndex(end => end < e.a);
      if (l === -1){ l = lanes.length; lanes.push(0); }
      lanes[l] = e.b; e.lane = l;
    });
    const L = Math.max(1, lanes.length);

    const inner = evs.map(e => {
      const span = e.b - e.a + 1;
      const w = `calc(${(100/L).toFixed(4)}% - 3px)`;
      return `<div class="p-ev" style="--pc:${e.member && M[e.member].color};
        background:${tint(M[e.member].color, .13)};
        top:calc(var(--rh) * ${e.a-1} + 2px);
        height:calc(var(--rh) * ${span} - 4px);
        left:calc(${(100/L*e.lane).toFixed(4)}% + 2px);width:${w}"
        title="${esc(e.title)}">${e.time && span===1 ? `<b>${e.time}</b>` : ''}${esc(e.title)}</div>`;
    }).join('');

    html += `<div class="p-col" style="grid-row:2/-1;grid-column:${ci+2}">${inner}</div>`;
  });

  return `<div class="p-wrap"><div class="p-scroll"><div class="pgrid"
    style="grid-template-columns:58px repeat(${cols.length},minmax(${cols.length>2?'92px':'150px'},1fr));
           grid-template-rows:34px repeat(${nDays},var(--rh))">${html}</div></div></div>
    <p class="p-legend">Seitlich wischen, wenn nicht alle Spalten Platz haben. Auf einen Tag tippen zeigt ihn unten im Detail.</p>`;
}

function rasterHTML(){
  const y = S.ui.calYear, mo = S.ui.calMonth, filt = S.ui.calFilter;
  const first = new Date(y, mo, 1);
  const start = addDays(first, -((first.getDay()+6)%7));
  let cells = '';
  for (let i = 0; i < 42; i++){
    const d = addDays(start, i), k = iso(d);
    const list = eventsOn(k).filter(e => filt==='alle' || e.member===filt);
    const pips = [...new Set(list.map(e => e.member))].slice(0,4)
      .map(id => `<i class="pip" style="background:${M[id].color}"></i>`).join('');
    cells += `<button class="day ${d.getMonth()!==mo?'out':''} ${k===TODAY_ISO?'today':''}"
      data-day="${k}" ${k===S.ui.calSel?'aria-pressed="true"':''}>
      ${d.getDate()}<span class="pips">${pips}</span></button>`;
  }
  return `<div class="cal" style="margin-top:12px">
    <div class="grid">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div class="wd">${d}</div>`).join('')}</div>
    <div class="grid">${cells}</div></div>`;
}

      <button class="btn ghost" data-sheet="menu">${icon('plus',15)} Menü</button></div>
    <div class="card">
      ${S.menu.length ? S.menu.map((m,ix) => `<div class="row">
        <div class="body"><div class="t">${m.day} · ${esc(m.meal)}</div>
          <div class="s">${(m.zutaten||[]).map(esc).join(', ') || 'keine Zutaten hinterlegt'}</div></div>
        ${(m.zutaten||[]).length ? `<button class="linkbtn" data-menu="${ix}">Übernehmen</button>` : ''}
        <button class="linkbtn" data-delmenu="${ix}" aria-label="Menü löschen">×</button>
      </div>`).join('') : '<div class="empty">Noch kein Menü geplant. Zutaten lassen sich später mit einem Tipp in die Einkaufsliste übernehmen.</div>'}
    </div>
  </section>`;
}

/* ============ Schule ============ */
function viewSchool(){
  const f = S.ui.schoolFilter;
  const pick = x => f==='alle' || x.member===f;
  const pruef = S.school.filter(x => x.kind==='pruefung' && pick(x)).sort((a,b)=>a.due.localeCompare(b.due));
  const hausi = S.school.filter(x => x.kind==='hausaufgabe' && pick(x))
    .sort((a,b) => a.done - b.done || a.due.localeCompare(b.due));

  return `
  <div class="chips">
    <button class="chip" data-sfilter="alle" aria-pressed="${f==='alle'}">Alle Kinder</button>
    ${KIDS.map(k => `<button class="chip" data-sfilter="${k.id}" aria-pressed="${f===k.id}">
      <i class="dot" style="background:${k.color}"></i>${k.name}</button>`).join('')}
  </div>

  <section class="sec">
    <div class="sec-head"><h2>Prüfungen</h2>
      <button class="btn ghost" data-sheet="school">${icon('plus',15)} Eintrag</button></div>
    <div class="card">${pruef.length ? pruef.map(p => { const n = daysUntil(p.due); return `
      <div class="row" style="--pc:${M[p.member].color}"><i class="bar"></i>
        ${av(p.member,'sm')}
        <div class="body"><div class="t">${esc(p.subject)}: ${esc(p.title)}</div>
          <div class="s">${fmtDay(p.due)} · ${M[p.member].name}</div></div>
        <div class="r" ${n<=2?'style="color:var(--alert)"':''}>${n===0?'heute':n===1?'morgen':'in '+n+' T'}</div>
      </div>`; }).join('') : '<div class="empty">Keine Prüfungen eingetragen.</div>'}
    </div>
  </section>

  <section class="sec">
    <div class="sec-head"><h2>Hausaufgaben</h2>
      <span class="hint">${hausi.filter(h=>!h.done).length} offen</span></div>
    <div class="card">${hausi.length ? hausi.map(h => `
      <div class="row ${h.done?'done':''}" style="--pc:${M[h.member].color}">
        <button class="check" data-hw="${h.id}" aria-pressed="${h.done}" aria-label="Erledigt">${icon('check',13)}</button>
        <div class="body"><div class="t">${esc(h.subject)}: ${esc(h.title)}</div>
          <div class="s">${M[h.member].name} · bis ${relDay(h.due)}</div></div>
      </div>`).join('') : '<div class="empty">Nichts aufgegeben.</div>'}
    </div>
  </section>`;
}

/* ============ Ämtli & Sackgeld ============ */
function viewChores(){
  return `
  <section class="sec">
    <div class="sec-head"><h2>Ämtli heute</h2>
      <button class="btn ghost" data-sheet="chore">${icon('plus',15)} Ämtli</button></div>
    ${KIDS.map(k => `
      <div class="card" style="--pc:${k.color}">
        <div style="display:flex;align-items:center;gap:10px">
          ${av(k.id)}
          <div style="flex:1"><div style="font-weight:600">${k.name}</div>
            <div style="font-size:12.5px;color:var(--muted)">${choresOf(k.id).length - openChoresToday(k.id)} von ${choresOf(k.id).length} erledigt</div></div>
        </div>
        <div style="margin-top:6px">
          ${choresOf(k.id).length ? choresOf(k.id).map(c => { const d = c.done.includes(TODAY_ISO); return `
            <div class="row ${d?'done':''}" style="--pc:${k.color}">
              <button class="check" data-chore="${c.id}" aria-pressed="${d}" aria-label="Erledigt">${icon('check',13)}</button>
              <div class="body"><div class="t">${esc(c.title)}</div><div class="s">${esc(c.rhythm)}</div></div>
              <button class="linkbtn" data-delchore="${c.id}" aria-label="Ämtli löschen">×</button>
            </div>`; }).join('') : '<div class="empty">Noch kein Ämtli für ' + k.name + '.</div>'}
        </div>
      </div>`).join('')}
  </section>

  <section class="sec">
    <div class="sec-head"><h2>Strichliste</h2><span class="hint">Woche ${fmtDay(WEEK[0])} – ${fmtDay(WEEK[6])}</span></div>
    ${KIDS.map(k => {
      const st = strikesOf(k.id), abz = deduction(k.id);
      return `<div class="card" style="--pc:${k.color}">
        <div style="display:flex;align-items:center;gap:10px">
          ${av(k.id)}
          <div style="flex:1"><div style="font-weight:600">${k.name}</div>
            <div class="strikes">${st.length ? '|'.repeat(Math.min(st.length,12)) : '<span style="color:var(--muted);font-family:Inter">keine Striche</span>'}</div></div>
        </div>
        <div class="money"><span class="big">${chf(payout(k.id))}</span>
          ${abz ? `<span class="was">${chf(SACKGELD[k.id])}</span>` : ''}</div>
        ${st.length ? `<div class="ledger">${st.map(s => `
          <div class="li"><span>${fmtDay(s.date)} · ${esc(s.reason)}</span>
            <span><b>−${s.amount.toFixed(2)}</b>
            <button class="linkbtn" data-unstrike="${s.id}" aria-label="Strich entfernen">×</button></span></div>`).join('')}</div>` : ''}
        <div class="tallybtns">
          ${REASONS.map(r => `<button class="tallybtn" data-strike="${k.id}|${r.r}|${r.a}">+ ${r.r}</button>`).join('')}
        </div>
      </div>`;
    }).join('')}
    <p class="footnote">Basis: CHF 1.00 pro Lebensjahr und Woche. Auszahlung sonntags.</p>
  </section>`;
}

/* ============ Chat ============ */
function viewChat(){
  return `
  <div class="chatwrap">
    ${S.chat.map(m => `<div class="msg ${m.member==='ka'?'me':''}">
      ${av(m.member,'sm')}
      <div><div class="who">${M[m.member].name} · ${m.t}</div><div class="bub">${esc(m.text)}</div></div>
    </div>`).join('')}
  </div>
  <div class="chatbar">
    <input id="chatInput" placeholder="Nachricht an die Familie" aria-label="Nachricht schreiben">
    <button class="btn" data-send>Senden</button>
  </div>`;
}

/* ============ Sheets ============ */
function openSheet(kind){
  const sel = S.ui.calSel;
  const html = kind === 'event' ? `
    <h3>Neuer Termin</h3>
    <div class="field"><label for="f-title">Was</label><input id="f-title" placeholder="z. B. Zahnarzt"></div>
    <div class="field"><label for="f-mem">Wer</label><select id="f-mem">${MEMBERS.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select></div>
    <div class="field two">
      <div style="flex:2"><label for="f-date">Wann</label><input id="f-date" type="date" value="${sel}"></div>
      <div style="flex:1"><label for="f-time">Zeit</label><input id="f-time" type="time" value="17:00"></div>
    </div>
    <div class="field"><label for="f-end">Bis (nur bei mehrtägigem, sonst leer lassen)</label><input id="f-end" type="date"></div>
    <div class="field"><label for="f-place">Wo (optional)</label><input id="f-place" placeholder="Ort"></div>
    <div class="actions"><button class="btn ghost" data-close>Abbrechen</button><button class="btn" data-save="event">Termin sichern</button></div>`
  : kind === 'chore' ? `
    <h3>Neues Ämtli</h3>
    <div class="field"><label for="f-mem">Kind</label><select id="f-mem">${KIDS.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select></div>
    <div class="field"><label for="f-title">Was</label><input id="f-title" placeholder="z. B. Abfall rausbringen"></div>
    <div class="field"><label for="f-rhythm">Wie oft</label><input id="f-rhythm" placeholder="täglich, Mo/Do, wöchentlich …" value="täglich"></div>
    <div class="actions"><button class="btn ghost" data-close>Abbrechen</button><button class="btn" data-save="chore">Ämtli sichern</button></div>`
  : kind === 'menu' ? `
    <h3>Neues Menü</h3>
    <div class="field"><label for="f-day">Tag</label><select id="f-day">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<option>${d}</option>`).join('')}</select></div>
    <div class="field"><label for="f-meal">Gericht</label><input id="f-meal" placeholder="z. B. Älplermagronen"></div>
    <div class="field"><label for="f-zut">Zutaten, mit Komma getrennt</label><input id="f-zut" placeholder="Hörnli, Kartoffeln, Apfelmus"></div>
    <div class="actions"><button class="btn ghost" data-close>Abbrechen</button><button class="btn" data-save="menu">Menü sichern</button></div>`
  : `
    <h3>Neuer Schuleintrag</h3>
    <div class="field"><label for="f-kind">Art</label><select id="f-kind">
      <option value="hausaufgabe">Hausaufgabe</option><option value="pruefung">Prüfung</option></select></div>
    <div class="field"><label for="f-mem">Kind</label><select id="f-mem">${KIDS.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select></div>
    <div class="field two">
      <div style="flex:1"><label for="f-subj">Fach</label><input id="f-subj" placeholder="Mathe"></div>
      <div style="flex:1"><label for="f-due">Bis</label><input id="f-due" type="date" value="${D(1)}"></div>
    </div>
    <div class="field"><label for="f-title">Was genau</label><input id="f-title" placeholder="Arbeitsblatt 12"></div>
    <div class="actions"><button class="btn ghost" data-close>Abbrechen</button><button class="btn" data-save="school">Eintrag sichern</button></div>`;
  const sh = $('#sheet'); sh.innerHTML = html;
  sh.classList.add('open'); $('#scrim').classList.add('open');
  setTimeout(() => sh.querySelector('input')?.focus(), 200);
}
function closeSheet(){ $('#sheet').classList.remove('open'); $('#scrim').classList.remove('open'); }

/* ============ Ereignisse ============ */
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  const d = t.dataset;

  if (d.tab){ tab = d.tab; window.scrollTo(0,0); return render(); }
  if (d.go){ tab = d.go; window.scrollTo(0,0); return render(); }
  if ('reset' in d){
    if (!confirm('Alle Einträge löschen? Die Termine aus dem Papierkalender werden neu eingelesen, alles andere ist weg.')) return;
    S = seed(); applyImport(); return render();
  }
  if ('close' in d) return closeSheet();
  if (d.sheet) return openSheet(d.sheet);

  if (d.mon){ let m = S.ui.calMonth + (+d.mon); if (m < 0){ m = 11; S.ui.calYear--; } if (m > 11){ m = 0; S.ui.calYear++; } S.ui.calMonth = m; return render(); }
  if (d.day){ S.ui.calSel = d.day; const dd = new Date(d.day+'T00:00'); S.ui.calMonth = dd.getMonth(); S.ui.calYear = dd.getFullYear(); return render(); }
  if (d.calview){ S.ui.calView = d.calview; return render(); }
  if (d.filter){ S.ui.calFilter = d.filter; return render(); }
  if (d.delev){ S.events = S.events.filter(x => x.id !== d.delev); return render(); }

  if (d.list){ S.ui.list = d.list; return render(); }
  if ('hidedone' in d){ S.ui.hideDone = !S.ui.hideDone; return render(); }
  if (d.item){ const l = S.lists.find(l=>l.id===S.ui.list); const i = l.items.find(i=>i.id===d.item); i.done = !i.done; return render(); }
  if (d.delitem){ const l = S.lists.find(l=>l.id===S.ui.list); l.items = l.items.filter(i=>i.id!==d.delitem); return render(); }
  if ('additem' in d){ addItem(); return; }
  if (d.menu){
    const l = S.lists.find(l=>l.id===S.ui.list);
    S.menu[+d.menu].zutaten.forEach(z => {
      if (!l.items.some(i => i.text.toLowerCase() === z.toLowerCase()))
        l.items.push({ id:uid(), text:z, done:false, by:'ka' });
    });
    return render();
  }

  if (d.sfilter){ S.ui.schoolFilter = d.sfilter; return render(); }
  if (d.hw){ const h = S.school.find(x=>x.id===d.hw); h.done = !h.done; return render(); }

  if (d.chore){
    const c = S.chores.find(x=>x.id===d.chore);
    c.done = c.done.includes(TODAY_ISO) ? c.done.filter(x=>x!==TODAY_ISO) : [...c.done, TODAY_ISO];
    return render();
  }
  if (d.delchore){ S.chores = S.chores.filter(c => c.id !== d.delchore); return render(); }
  if (d.delmenu){ S.menu.splice(+d.delmenu, 1); return render(); }
  if (d.strike){ const [m,r,a] = d.strike.split('|');
    S.strikes.push({ id:uid(), member:m, reason:r, date:TODAY_ISO, amount:parseFloat(a) }); return render(); }
  if (d.unstrike){ S.strikes = S.strikes.filter(s=>s.id!==d.unstrike); return render(); }

  if ('send' in d) return sendMsg();

  if (d.save === 'event'){
    const title = $('#f-title').value.trim(); if (!title) return $('#f-title').focus();
    const end = $('#f-end').value;
    S.events.push({ id:uid(), title, member:$('#f-mem').value, date:$('#f-date').value,
      time:$('#f-time').value, place:$('#f-place').value.trim(),
      ...(end && end > $('#f-date').value ? { end } : {}) });
    S.ui.calSel = $('#f-date').value; closeSheet(); return render();
  }
  if (d.save === 'chore'){
    const title = $('#f-title').value.trim(); if (!title) return $('#f-title').focus();
    S.chores.push({ id:uid(), member:$('#f-mem').value, title,
      rhythm:$('#f-rhythm').value.trim() || 'täglich', done:[] });
    closeSheet(); return render();
  }
  if (d.save === 'menu'){
    const meal = $('#f-meal').value.trim(); if (!meal) return $('#f-meal').focus();
    S.menu.push({ day:$('#f-day').value, meal,
      zutaten:$('#f-zut').value.split(',').map(z => z.trim()).filter(Boolean) });
    closeSheet(); return render();
  }
  if (d.save === 'school'){
    const title = $('#f-title').value.trim(); if (!title) return $('#f-title').focus();
    S.school.push({ id:uid(), kind:$('#f-kind').value, member:$('#f-mem').value,
      subject:$('#f-subj').value.trim() || 'Allgemein', title, due:$('#f-due').value, done:false });
    closeSheet(); return render();
  }
});

$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
document.addEventListener('keypress', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'shopInput') addItem();
  if (e.target.id === 'chatInput') sendMsg();
});

function addItem(){
  const el = $('#shopInput'); const v = el.value.trim(); if (!v) return el.focus();
  S.lists.find(l => l.id === S.ui.list).items.push({ id:uid(), text:v, done:false, by:'ka' });
  render(); $('#shopInput').focus();
}
function sendMsg(){
  const el = $('#chatInput'); const v = el.value.trim(); if (!v) return el.focus();
  const now = new Date();
  S.chat.push({ id:uid(), member:'ka', text:v,
    t:`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}` });
  render(); $('#chatInput').focus();
}

/* Hell / Dunkel */
function paintTheme(){
  const dark = document.documentElement.dataset.theme === 'dark' ||
    (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  $('#themeBtn').innerHTML = icon(dark ? 'sun' : 'moon', 19);
}
try { const th = localStorage.getItem(KEY+'-theme'); if (th) document.documentElement.dataset.theme = th; } catch(e){}
$('#themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const nxt = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = nxt;
  try { localStorage.setItem(KEY+'-theme', nxt); } catch(e){}
  paintTheme();
});

paintTheme();
render();

/* Offline-Fähigkeit: läuft nur auf https, lokal wird es still übersprungen */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
