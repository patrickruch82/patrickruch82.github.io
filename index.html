<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Familienhub</title>
<meta name="description" content="Familienkalender, Einkauf, Schule und Ämtli für Ka, Pädu, Anna, Moritz und Paul.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Familienhub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141714" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png" sizes="512x512" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F2EC;
  --surface:#FFFFFF;
  --surface-2:#F7F8F3;
  --ink:#1C2621;
  --muted:#6E7670;
  --line:#DDE0D6;
  --line-soft:#E9EBE3;
  --alert:#B33B2E;
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 -1px 0 var(--line), 0 -8px 24px rgba(28,38,33,.06);
  --pad:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141714;
    --surface:#1D211D;
    --surface-2:#232823;
    --ink:#E9EDE6;
    --muted:#98A197;
    --line:#2E342E;
    --line-soft:#272C27;
    --alert:#E0705F;
    --shadow:0 -1px 0 var(--line), 0 -8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#141714; --surface:#1D211D; --surface-2:#232823;
  --ink:#E9EDE6; --muted:#98A197; --line:#2E342E; --line-soft:#272C27;
  --alert:#E0705F; --shadow:0 -1px 0 var(--line), 0 -8px 24px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;height:100%;
  background:var(--paper);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.num{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;font-weight:600;letter-spacing:-.015em;margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- Shell ---------- */
.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:var(--paper);border-bottom:1px solid var(--line-soft);
  padding:12px var(--pad) 10px;
  display:flex;align-items:baseline;gap:10px;justify-content:space-between;
}
.topbar .date{font-size:12.5px;color:var(--muted)}
.topbar h1{font-size:20px}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
main{flex:1;padding:var(--pad) var(--pad) 96px}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--surface);box-shadow:var(--shadow);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  display:flex;
}
.tabbar-inner{max-width:760px;margin:0 auto;display:flex;width:100%}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:10.5px;font-weight:500}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .tabdot{opacity:1}
.tabdot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:0;margin-top:-1px}
.tab svg{width:21px;height:21px}

/* ---------- Bausteine ---------- */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px}
.card + .card{margin-top:12px}
.sec{margin-top:26px}
.sec:first-child{margin-top:4px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-head h2{font-size:16px}
.sec-head .hint{font-size:12.5px;color:var(--muted)}
.linkbtn{font-size:13px;font-weight:500;color:var(--muted);padding:4px 8px;border-radius:8px}
.linkbtn:hover{background:var(--surface-2);color:var(--ink)}
.btn{background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:999px;font-size:14px;font-weight:500}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:active{transform:translateY(1px)}
.empty{color:var(--muted);font-size:13.5px;padding:14px;border:1px dashed var(--line);border-radius:var(--radius);text-align:center}

.avatar{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;
  color:#fff;font-weight:600;font-size:12.5px;letter-spacing:-.01em;font-family:"Bricolage Grotesque",sans-serif;
}
.avatar.sm{width:24px;height:24px;font-size:9.5px}
.avatar.lg{width:44px;height:44px;font-size:15.5px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin:0 calc(var(--pad)*-1);padding-left:var(--pad);padding-right:var(--pad);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none;
  border:1px solid var(--line);background:var(--surface);
  padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);
}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}

/* Heute-Streifen */
.today-strip{display:flex;gap:8px;overflow-x:auto;margin:0 calc(var(--pad)*-1);padding:2px var(--pad) 6px;scrollbar-width:none}
.today-strip::-webkit-scrollbar{display:none}
.person-col{
  flex:none;width:138px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--radius);padding:12px;border-top:3px solid var(--pc);
}
.person-col .nm{font-size:13px;font-weight:600;margin-top:8px}
.person-col .nx{font-size:12.5px;color:var(--muted);margin-top:4px;min-height:34px}
.person-col .tm{font-family:"Bricolage Grotesque",sans-serif;font-size:15px;font-weight:600;margin-top:6px}

/* Zeilen */
.row{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:none}
.row .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--pc);flex:none;min-height:34px}
.row .body{flex:1;min-width:0}
.row .t{font-size:14.5px;font-weight:500;line-height:1.3}
.row .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.row .r{font-family:"Bricolage Grotesque",sans-serif;font-size:14px;font-weight:600;white-space:nowrap;padding-top:1px}
.row.done .t{text-decoration:line-through;color:var(--muted)}

.check{
  width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex:none;
  display:grid;place-items:center;margin-top:1px;background:var(--surface);
}
.check[aria-pressed="true"]{background:var(--pc,var(--ink));border-color:var(--pc,var(--ink))}
.check svg{width:13px;height:13px;color:#fff;opacity:0}
.check[aria-pressed="true"] svg{opacity:1}

/* Kalender */
.cal{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:10px 8px 8px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 10px}
.cal-head .mon{font-family:"Bricolage Grotesque",sans-serif;font-size:16px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{text-align:center;font-size:11px;color:var(--muted);padding-bottom:4px;font-weight:500}
.day{aspect-ratio:1/1.08;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;gap:3px;font-size:13px;position:relative}
.day.out{color:var(--line)}
.day.today{background:var(--surface-2);font-weight:600}
.day[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.day .pips{display:flex;gap:2px;position:absolute;bottom:6px}
.day .pip{width:4px;height:4px;border-radius:50%}
.day[aria-pressed="true"] .pip{box-shadow:0 0 0 1px var(--paper)}

/* Einkauf */
.addbar{display:flex;gap:8px;align-items:center;padding:10px 0 2px}
.addbar input{
  flex:1;background:var(--surface-2);border:1px solid var(--line-soft);
  border-radius:10px;padding:10px 12px;font-size:14.5px;min-width:0;
}
.addbar input::placeholder{color:var(--muted)}
.qty{font-size:12.5px;color:var(--muted)}

/* Sackgeld */
.money{display:flex;align-items:flex-end;gap:8px;margin-top:2px}
.money .big{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;font-weight:700;line-height:1}
.money .was{font-size:13px;color:var(--muted);text-decoration:line-through;padding-bottom:3px}
.ledger{margin-top:10px;border-top:1px solid var(--line-soft);padding-top:8px}
.ledger .li{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;color:var(--muted)}
.ledger .li b{font-weight:500;color:var(--alert);font-family:"Bricolage Grotesque",sans-serif}
.tallybtns{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.tallybtn{border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--muted)}
.tallybtn:hover{border-color:var(--ink);color:var(--ink)}
.strikes{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:1px;font-size:15px;color:var(--alert)}

/* Chat */
.chatwrap{display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;display:flex;gap:9px;align-items:flex-end}
.msg .bub{background:var(--surface);border:1px solid var(--line-soft);padding:9px 12px;border-radius:14px 14px 14px 4px;font-size:14.5px}
.msg .who{font-size:11.5px;color:var(--muted);margin-bottom:2px;font-weight:500}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:var(--ink);color:var(--paper);border-color:var(--ink);border-radius:14px 14px 4px 14px}
.chatbar{display:flex;gap:8px;margin-top:16px;position:sticky;bottom:0;background:var(--paper);padding:8px 0}
.chatbar input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 15px;min-width:0}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(20,26,22,.42);z-index:50;display:none}
.scrim.open{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);
  border-radius:18px 18px 0 0;padding:18px var(--pad) calc(22px + env(safe-area-inset-bottom,0px));
  max-width:760px;margin:0 auto;transform:translateY(100%);transition:transform .22s ease;
  max-height:88vh;overflow-y:auto;
}
.sheet.open{transform:translateY(0)}
.sheet h3{font-size:17px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px}
.field .two{display:flex;gap:10px}
.sheet .actions{display:flex;gap:10px;margin-top:18px}
.sheet .actions .btn{flex:1;text-align:center}

.footnote{margin-top:28px;text-align:center;font-size:12px;color:var(--muted)}
.footnote button{text-decoration:underline;color:var(--muted);font-size:12px}

@media (min-width:720px){
  main{padding:22px 22px 110px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  .cols .sec{margin-top:0}
  .cols .sec + .sec{margin-top:26px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="date" id="topDate"></div>

  </header>
  <main id="view"></main>
  <nav class="tabbar"><div class="tabbar-inner" id="tabs"></div></nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<script>
"use strict";

/* ============ Icons ============ */
const I = {

const icon = (n, s = 20) =>

/* ============ Stammdaten ============ */
const MEMBERS = [
  { id:'ka',     name:'Ka',     ini:'Ka', color:'#6B3FA0', kid:false },

const M = Object.fromEntries(MEMBERS.map(m => [m.id, m]));

const TODAY_ISO = iso(TODAY);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];

const relDay = s => { const n = daysUntil(s); return n===0 ? 'Heute' : n===1 ? 'Morgen' : n===-1 ? 'Gestern' : fmtDay(s); };
const chf = n => (n<0?'−':'') + 'CHF ' + Math.abs(n).toFixed(2);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D = n => iso(addDays(TODAY, n));

/* ============ Demodaten ============ */
function seed(){ return {

    { id:uid(), member:'paul',    title:'Kindergeburtstag Elin', time:'14:00', date:D(0),  place:'Familiengarten' },

    { id:uid(), member:'anna',   title:'Kino mit Nina',         time:'19:00', date:D(4)  },
    { id:uid(), member:'ka', title:'Spätschicht',           time:'13:00', date:D(5)  },

  ],
  lists: [
    { id:'migros', name:'Migros', items:[

    { id:uid(), member:'moritz', title:'Katze füttern',         rhythm:'täglich',    done:[D(-1)] },
    { id:uid(), member:'paul',  title:'Schuhe versorgen',      rhythm:'täglich',    done:[D(0)] },
    { id:uid(), member:'paul',  title:'Spielsachen aufräumen', rhythm:'Mi, Sa',     done:[] }
  ],
  strikes: [
    { id:uid(), member:'anna', reason:'Turnsack vergessen',    date:D(-4), amount:.5 },
    { id:uid(), member:'anna', reason:'Handy am Tisch',        date:D(-2), amount:.5 },
    { id:uid(), member:'moritz', reason:'Znüni vergessen',       date:D(-5), amount:.5 },
    { id:uid(), member:'moritz', reason:'Znüni vergessen',       date:D(-1), amount:.5 },
    { id:uid(), member:'moritz', reason:'Ämtli nicht gemacht',   date:D(-3), amount:1 },

  ],
  chat: [
    { id:uid(), member:'ka', text:'Wer holt Paul um 16 Uhr vom Schwimmen ab?', t:'08:12' },

    { id:uid(), member:'ka', text:'Fragen wir heute Abend am Tisch.',         t:'09:41' },
    { id:uid(), member:'moritz',   text:'Mein Fussballmatch ist verschoben, jetzt Mittwoch!', t:'11:02' }
  ],
  ui: { list:'migros', calMonth:TODAY.getMonth(), calYear:TODAY.getFullYear(), calSel:TODAY_ISO, calFilter:'alle', schoolFilter:'alle', hideDone:false }
};}

const REASONS = [
  { r:'Znüni vergessen', a:.5 }, { r:'Turnsack vergessen', a:.5 },
  { r:'Ämtli nicht gemacht', a:1 }, { r:'Handy am Tisch', a:.5 },
  { r:'Zimmer nicht aufgeräumt', a:.5 }
];
const SACKGELD = { anna:13, moritz:10, paul:6 };   // CHF pro Woche, Auszahlung sonntags

/* ============ Zustand ============ */
const KEY = 'familienhub-v2';
let S;
try { const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : seed(); }
catch(e){ S = seed(); }
if (!S || !S.events) S = seed();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* ============ Helfer ============ */
const ev = (a,b) => (a.time||'').localeCompare(b.time||'');
const eventsOn = d => S.events.filter(e => e.date === d).sort(ev);
const av = (id, cls='') => { const m = M[id]; return `<span class="avatar ${cls}" style="background:${m.color}">${m.ini}</span>`; };
function thisWeek(){ // Mo–So der laufenden Woche
  const off = (TODAY.getDay() + 6) % 7;
  return Array.from({length:7}, (_,i) => iso(addDays(TODAY, -off + i)));
}
const WEEK = thisWeek();
const strikesOf = id => S.strikes.filter(s => s.member===id && WEEK.includes(s.date));
const deduction = id => strikesOf(id).reduce((n,s) => n + s.amount, 0);
const payout = id => Math.max(0, (SACKGELD[id]||0) - deduction(id));
const choresOf = id => S.chores.filter(c => c.member === id);
const openChoresToday = id => choresOf(id).filter(c => !c.done.includes(TODAY_ISO)).length;

/* ============ Router ============ */
const TABS = [
  { id:'home',   label:'Start',    icon:'home' },
  { id:'cal',    label:'Kalender', icon:'cal' },
  { id:'shop',   label:'Einkauf',  icon:'cart' },
  { id:'school', label:'Schule',   icon:'book' },
  { id:'chores', label:'Ämtli',    icon:'star' },
  { id:'chat',   label:'Chat',     icon:'chat' }
];
let tab = 'home';
const $ = s => document.querySelector(s);

function render(){
  const t = TABS.find(x => x.id === tab);
  $('#topTitle').textContent = { home:'Startseite', cal:'Familienkalender', shop:'Einkauf', school:'Schule', chores:'Ämtli & Sackgeld', chat:'Familienchat' }[tab];
  $('#topDate').textContent = `${WDL[TODAY.getDay()]}, ${TODAY.getDate()}. ${MON[TODAY.getMonth()]} ${TODAY.getFullYear()}`;
  $('#tabs').innerHTML = TABS.map(x =>
    `<button class="tab" data-tab="${x.id}" ${x.id===tab?'aria-current="page"':''}>${icon(x.icon)}<span>${x.label}</span><i class="tabdot"></i></button>`
  ).join('');
  $('#view').innerHTML = ({ home:viewHome, cal:viewCal, shop:viewShop, school:viewSchool, chores:viewChores, chat:viewChat })[tab]();
  if (tab === 'chat') window.scrollTo(0, document.body.scrollHeight);
  save();
}

/* ============ Startseite ============ */
function viewHome(){
  const strip = MEMBERS.map(m => {
    const next = eventsOn(TODAY_ISO).find(e => e.member === m.id);
    return `<div class="person-col" style="--pc:${m.color}">
      ${av(m.id,'lg')}
      <div class="nm">${m.name}</div>
      <div class="nx">${next ? esc(next.title) : (m.kid ? (openChoresToday(m.id) ? openChoresToday(m.id)+' Ämtli offen' : 'Alles erledigt') : 'Nichts eingetragen')}</div>
      ${next ? `<div class="tm">${next.time}</div>` : ''}
    </div>`;
  }).join('');

  const next7 = S.events.filter(e => daysUntil(e.date) >= 0 && daysUntil(e.date) <= 6)
    .sort((a,b) => a.date.localeCompare(b.date) || ev(a,b)).slice(0,5);

  const openShop = S.lists.reduce((n,l) => n + l.items.filter(i => !i.done).length, 0);
  const pruef = S.school.filter(x => x.kind==='pruefung' && daysUntil(x.due) >= 0)
    .sort((a,b) => a.due.localeCompare(b.due)).slice(0,2);
  const hausis = S.school.filter(x => x.kind==='hausaufgabe' && !x.done && daysUntil(x.due) <= 1).length;

  return `
  <section class="sec">
    <div class="sec-head"><h2>Heute</h2><span class="hint">${eventsOn(TODAY_ISO).length} Termine</span></div>
    <div class="today-strip">${strip}</div>
  </section>

  <div class="cols">
  <section class="sec">
    <div class="sec-head"><h2>Diese Woche</h2><button class="linkbtn" data-go="cal">Kalender</button></div>
    <div class="card">${next7.length ? next7.map(e => `
      <div class="row" style="--pc:${M[e.member].color}">
        <i class="bar"></i>
        <div class="body"><div class="t">${esc(e.title)}</div>
          <div class="s">${relDay(e.date)} · ${M[e.member].name}${e.place ? ' · '+esc(e.place) : ''}</div></div>
        <div class="r">${e.time||''}</div>
      </div>`).join('') : '<div class="empty">Keine Termine in den nächsten sieben Tagen.</div>'}

  </section>

  <section class="sec">
    <div class="sec-head"><h2>Schule</h2><button class="linkbtn" data-go="school">Alle</button></div>
    <div class="card">
      ${pruef.map(p => `<div class="row" style="--pc:${M[p.member].color}"><i class="bar"></i>
        <div class="body"><div class="t">${esc(p.subject)}: ${esc(p.title)}</div>
        <div class="s">${M[p.member].name} · Prüfung ${relDay(p.due)}</div></div>
        <div class="r">${daysUntil(p.due)===0?'heute':'in '+daysUntil(p.due)+'T'}</div></div>`).join('')}
      <div class="row"><div class="body"><div class="t">${hausis} Hausaufgaben bis morgen</div>
        <div class="s">offen über alle Kinder</div></div></div>
    </div>
  </section>

  <section class="sec">
    <div class="sec-head"><h2>Einkauf</h2><button class="linkbtn" data-go="shop">Listen</button></div>
    <div class="card">
      ${S.lists.map(l => { const o = l.items.filter(i=>!i.done).length; return `
        <div class="row"><div class="body"><div class="t">${esc(l.name)}</div>
        <div class="s">${o ? o+' offen' : 'abgehakt'}</div></div>

  <section class="sec">
    <div class="sec-head"><h2>Sackgeld</h2><span class="hint">Auszahlung heute Abend</span></div>
    <div class="card">
      ${KIDS.map(k => `<div class="row" style="--pc:${k.color}">
        ${av(k.id,'sm')}
        <div class="body"><div class="t">${k.name}</div>
        <div class="s">${strikesOf(k.id).length ? strikesOf(k.id).length+' Striche diese Woche' : 'keine Striche'}</div></div>
        <div class="r">${chf(payout(k.id))}</div></div>`).join('')}

  <p class="footnote">Prototyp mit Beispieldaten. <button data-reset>Demodaten zurücksetzen</button></p>`;

/* ============ Kalender ============ */
function viewCal(){
  const y = S.ui.calYear, mo = S.ui.calMonth;
  const first = new Date(y, mo, 1);
  const lead = (first.getDay() + 6) % 7;
  const start = addDays(first, -lead);
  const filt = S.ui.calFilter;

  let cells = '';
  for (let i = 0; i < 42; i++){
    const d = addDays(start, i), k = iso(d);
    const list = eventsOn(k).filter(e => filt==='alle' || e.member===filt);
    const pips = [...new Set(list.map(e => e.member))].slice(0,4)
      .map(id => `<i class="pip" style="background:${M[id].color}"></i>`).join('');
    cells += `<button class="day ${d.getMonth()!==mo?'out':''} ${k===TODAY_ISO?'today':''}"
      data-day="${k}" ${k===S.ui.calSel?'aria-pressed="true"':''}>
      ${d.getDate()}<span class="pips">${pips}</span></button>`;
  }

  const sel = eventsOn(S.ui.calSel).filter(e => filt==='alle' || e.member===filt);

  return `
  <div class="chips">
    <button class="chip" data-filter="alle" aria-pressed="${filt==='alle'}">Alle</button>
    ${MEMBERS.map(m => `<button class="chip" data-filter="${m.id}" aria-pressed="${filt===m.id}">
      <i class="dot" style="background:${m.color}"></i>${m.name}</button>`).join('')}
  </div>

  <div class="cal" style="margin-top:12px">
    <div class="cal-head">
      <button class="iconbtn" data-mon="-1" aria-label="Vorheriger Monat">${icon('left',18)}</button>
      <span class="mon">${MON[mo]} ${y}</span>
      <button class="iconbtn" data-mon="1" aria-label="Nächster Monat">${icon('right',18)}</button>
    </div>
    <div class="grid">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div class="wd">${d}</div>`).join('')}</div>
    <div class="grid">${cells}</div>
  </div>

  <section class="sec">
    <div class="sec-head"><h2>${relDay(S.ui.calSel)}</h2>
      <button class="btn ghost" data-sheet="event">${icon('plus',15)} Termin</button></div>
    <div class="card">${sel.length ? sel.map(e => `
      <div class="row" style="--pc:${M[e.member].color}"><i class="bar"></i>
        ${av(e.member,'sm')}
        <div class="body"><div class="t">${esc(e.title)}</div>
          <div class="s">${M[e.member].name}${e.place ? ' · '+esc(e.place) : ''}</div></div>
        <div class="r">${e.time||''}</div>
        <button class="linkbtn" data-delev="${e.id}" aria-label="Termin löschen">×</button>
      </div>`).join('') : '<div class="empty">Nichts geplant. Tippe auf „Termin“, um etwas einzutragen.</div>'}
    </div>
  </section>`;
}

/* ============ Einkauf ============ */

/* ============ Schule ============ */

  const f = S.ui.schoolFilter;
  const pick = x => f==='alle' || x.member===f;
  const pruef = S.school.filter(x => x.kind==='pruefung' && pick(x)).sort((a,b)=>a.due.localeCompare(b.due));
  const hausi = S.school.filter(x => x.kind==='hausaufgabe' && pick(x))
    .sort((a,b) => a.done - b.done || a.due.localeCompare(b.due));

  return `
  <div class="chips">
    <button class="chip" data-sfilter="alle" aria-pressed="${f==='alle'}">Alle Kinder</button>
    ${KIDS.map(k => `<button class="chip" data-sfilter="${k.id}" aria-pressed="${f===k.id}">
      <i class="dot" style="background:${k.color}"></i>${k.name}</button>`).join('')}
  </div>

  <section class="sec">
    <div class="sec-head"><h2>Prüfungen</h2>
      <button class="btn ghost" data-sheet="school">${icon('plus',15)} Eintrag</button></div>
    <div class="card">${pruef.length ? pruef.map(p => { const n = daysUntil(p.due); return `
      <div class="row" style="--pc:${M[p.member].color}"><i class="bar"></i>
        ${av(p.member,'sm')}
        <div class="body"><div class="t">${esc(p.subject)}: ${esc(p.title)}</div>
          <div class="s">${fmtDay(p.due)} · ${M[p.member].name}</div></div>
        <div class="r" ${n<=2?'style="color:var(--alert)"':''}>${n===0?'heute':n===1?'morgen':'in '+n+' T'}</div>
      </div>`; }).join('') : '<div class="empty">Keine Prüfungen eingetragen.</div>'}

  <section class="sec">
    <div class="sec-head"><h2>Hausaufgaben</h2>
      <span class="hint">${hausi.filter(h=>!h.done).length} offen</span></div>
    <div class="card">${hausi.length ? hausi.map(h => `

        <button class="check" data-hw="${h.id}" aria-pressed="${h.done}" aria-label="Erledigt">${icon('check',13)}</button>
        <div class="body"><div class="t">${esc(h.subject)}: ${esc(h.title)}</div>
          <div class="s">${M[h.member].name} · bis ${relDay(h.due)}</div></div>
      </div>`).join('') : '<div class="empty">Nichts aufgegeben.</div>'}
    </div>
  </section>`;
}

/* ============ Sheets ============ */
function openSheet(kind){
  const sel = S.ui.calSel;
  const html = kind === 'event' ? `
    <h3>Neuer Termin</h3>
    <div class="field"><label for="f-title">Was</label><input id="f-title" placeholder="z. B. Zahnarzt"></div>
    <div class="field"><label for="f-mem">Wer</label><select id="f-mem">${MEMBERS.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select></div>
    <div class="field two">
      <div style="flex:2"><label for="f-date">Wann</label><input id="f-date" type="date" value="${sel}"></div>
      <div style="flex:1"><label for="f-time">Zeit</label><input id="f-time" type="time" value="17:00"></div>
    </div>
    <div class="field"><label for="f-place">Wo (optional)</label><input id="f-place" placeholder="Ort"></div>
    <div class="actions"><button class="btn ghost" data-close>Abbrechen</button><button class="btn" data-save="event">Termin sichern</button></div>`
  : `
    <h3>Neuer Schuleintrag</h3>
    <div class="field"><label for="f-kind">Art</label><select id="f-kind">
      <option value="hausaufgabe">Hausaufgabe</option><option value="pruefung">Prüfung</option></select></div>
    <div class="field"><label for="f-mem">Kind</label><select id="f-mem">${KIDS.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select></div>
    <div class="field two">
      <div style="flex:1"><label for="f-subj">Fach</label><input id="f-subj" placeholder="Mathe"></div>
      <div style="flex:1"><label for="f-due">Bis</label><input id="f-due" type="date" value="${D(1)}"></div>
    </div>
    <div class="field"><label for="f-title">Was genau</label><input id="f-title" placeholder="Arbeitsblatt 12"></div>
    <div class="actions"><button class="btn ghost" data-close>Abbrechen</button><button class="btn" data-save="school">Eintrag sichern</button></div>`;
  const sh = $('#sheet'); sh.innerHTML = html;
  sh.classList.add('open'); $('#scrim').classList.add('open');
  setTimeout(() => sh.querySelector('input')?.focus(), 200);
}
function closeSheet(){ $('#sheet').classList.remove('open'); $('#scrim').classList.remove('open'); }

/* ============ Ereignisse ============ */
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  const d = t.dataset;

  if (d.tab){ tab = d.tab; window.scrollTo(0,0); return render(); }
  if (d.go){ tab = d.go; window.scrollTo(0,0); return render(); }
  if ('reset' in d){ S = seed(); return render(); }
  if ('close' in d) return closeSheet();
  if (d.sheet) return openSheet(d.sheet);

  if (d.mon){ let m = S.ui.calMonth + (+d.mon); if (m < 0){ m = 11; S.ui.calYear--; } if (m > 11){ m = 0; S.ui.calYear++; } S.ui.calMonth = m; return render(); }
  if (d.day){ S.ui.calSel = d.day; const dd = new Date(d.day+'T00:00'); S.ui.calMonth = dd.getMonth(); S.ui.calYear = dd.getFullYear(); return render(); }
  if (d.filter){ S.ui.calFilter = d.filter; return render(); }
  if (d.delev){ S.events = S.events.filter(x => x.id !== d.delev); return render(); }

  if (d.list){ S.ui.list = d.list; return render(); }
  if ('hidedone' in d){ S.ui.hideDone = !S.ui.hideDone; return render(); }
  if (d.item){ const l = S.lists.find(l=>l.id===S.ui.list); const i = l.items.find(i=>i.id===d.item); i.done = !i.done; return render(); }
  if (d.delitem){ const l = S.lists.find(l=>l.id===S.ui.list); l.items = l.items.filter(i=>i.id!==d.delitem); return render(); }
  if ('additem' in d){ addItem(); return; }
  if (d.menu){
    const l = S.lists.find(l=>l.id===S.ui.list);
    S.menu[+d.menu].zutaten.forEach(z => {
      if (!l.items.some(i => i.text.toLowerCase() === z.toLowerCase()))
        l.items.push({ id:uid(), text:z, done:false, by:'ka' });
    });
    return render();
  }

  if (d.sfilter){ S.ui.schoolFilter = d.sfilter; return render(); }
  if (d.hw){ const h = S.school.find(x=>x.id===d.hw); h.done = !h.done; return render(); }

  if (d.chore){
    const c = S.chores.find(x=>x.id===d.chore);
    c.done = c.done.includes(TODAY_ISO) ? c.done.filter(x=>x!==TODAY_ISO) : [...c.done, TODAY_ISO];
    return render();
  }
  if (d.strike){ const [m,r,a] = d.strike.split('|');
    S.strikes.push({ id:uid(), member:m, reason:r, date:TODAY_ISO, amount:parseFloat(a) }); return render(); }
  if (d.unstrike){ S.strikes = S.strikes.filter(s=>s.id!==d.unstrike); return render(); }

  if ('send' in d) return sendMsg();

  if (d.save === 'event'){
    const title = $('#f-title').value.trim(); if (!title) return $('#f-title').focus();
    S.events.push({ id:uid(), title, member:$('#f-mem').value, date:$('#f-date').value,
      time:$('#f-time').value, place:$('#f-place').value.trim() });
    S.ui.calSel = $('#f-date').value; closeSheet(); return render();
  }
  if (d.save === 'school'){
    const title = $('#f-title').value.trim(); if (!title) return $('#f-title').focus();
    S.school.push({ id:uid(), kind:$('#f-kind').value, member:$('#f-mem').value,
      subject:$('#f-subj').value.trim() || 'Allgemein', title, due:$('#f-due').value, done:false });
    closeSheet(); return render();
  }
});

$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
document.addEventListener('keypress', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'shopInput') addItem();
  if (e.target.id === 'chatInput') sendMsg();
});

function addItem(){
  const el = $('#shopInput'); const v = el.value.trim(); if (!v) return el.focus();
  S.lists.find(l => l.id === S.ui.list).items.push({ id:uid(), text:v, done:false, by:'ka' });
  render(); $('#shopInput').focus();
}
function sendMsg(){
  const el = $('#chatInput'); const v = el.value.trim(); if (!v) return el.focus();
  const now = new Date();
  S.chat.push({ id:uid(), member:'ka', text:v,
    t:`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}` });
  render(); $('#chatInput').focus();
}

/* Hell / Dunkel */
function paintTheme(){
  const dark = document.documentElement.dataset.theme === 'dark' ||
    (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  $('#themeBtn').innerHTML = icon(dark ? 'sun' : 'moon', 19);
}
try { const th = localStorage.getItem(KEY+'-theme'); if (th) document.documentElement.dataset.theme = th; } catch(e){}
$('#themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const nxt = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = nxt;
  try { localStorage.setItem(KEY+'-theme', nxt); } catch(e){}
  paintTheme();
});

paintTheme();
render();

/* Offline-Fähigkeit: läuft nur auf https, lokal wird es still übersprungen */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
